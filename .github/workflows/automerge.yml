name: automerge
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  dependabot:
    permissions:
      contents: write
      pull-requests: write

    if: ${{ github.event_pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@db30297b9e3059972f088a4a2f1ff5c8c03c4c9b # v2.3.0

      - name: log metadata
        run: echo "${DEPENDABOT_METADATA}"
        env:
          DEPENDABOT_METADATA: ${{ toJson(steps.metadata.outputs) }}

      - name: automerge
        if: ${{ !contains(steps.metadata.outputs.update-type, 'major' ) }}
        run: gh pr merge "${PR_NUMBER}" --auto --squash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  pre-commit-ci:
    permissions:
      contents: write
      pull-requests: write

    if: ${{ github.event_pull_request.user.login == 'pre-commit-ci[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: automerge
        run: gh pr merge "${PR_NUMBER}" --auto --squash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
