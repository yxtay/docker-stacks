name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@0636e30522ac1d88b3de47b7d58b734edf0f153f # v1.3.0

      - name: Fetch Secrets from Doppler
        run: |
          doppler secrets download --format env --no-file > .env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Set Environment Variables
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            {
              echo "DEPLOY_ENVIRONMENT=staging"
              echo "DOKPLOY_APP_ID=${{ secrets.DOKPLOY_STAGING_APP_ID }}"
            } >> "$GITHUB_ENV"
          else
            {
              echo "DEPLOY_ENVIRONMENT=production"
              echo "DOKPLOY_APP_ID=${{ secrets.DOKPLOY_PROD_APP_ID }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Trigger Dokploy Deployment
        run: |
          curl -X 'POST' \
            "${{ secrets.DOKPLOY_URL }}/api/project.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H 'Content-Type: application/json' \
            -d "{\"projectId\": \"${{ env.DOKPLOY_APP_ID }}\"}"
