services:
  hermes:
    # nosemgrep
    image: nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    command: gateway run
    working_dir: /opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.${DOMAIN:?}}
      HERMES_WRITE_SAFE_ROOT: /opt/data:/tmp
      MNEMOSYNE_CROSS_SESSION: 1
      MNEMOSYNE_DEFAULT_SCOPE: global
      MNEMOSYNE_LLM_ENABLED: 1
      MNEMOSYNE_HOST_LLM_ENABLED: 1
      MNEMOSYNE_HOST_LLM_TIMEOUT: 120
      CAMOFOX_URL: http://camofox:9377
      DOCKER_HOST: tcp://socket-proxy:2375
      FIRECRAWL_API_URL: http://fastcrw:3000
      SEARXNG_URL: http://searxng:8080
      PATH: /opt/data/home/.local/bin:/opt/data/bin:/opt/hermes/.venv/bin:/opt/hermes/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      OBSIDIAN_VAULT_PATH: /opt/data/wiki
      WIKI_PATH: /opt/data/wiki
    env_file:
      - .env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/hermes:/opt/data
      - /apps/hermes/profile.d/hermes-path.sh:/etc/profile.d/hermes-path.sh:ro
      - /apps/:/apps:ro
    tmpfs:
      - /run:exec
      - /tmp:exec
    expose:
      - 8642
      - 9119
    networks:
      - default
      - socket
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9119/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http

  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.3@sha256:5907a638bb14ee873500f6161dd3aaa4d9b3e67a35912db8c9995e134d990ec0
    environment:
      ALLOW_LOGS: 1
      ALLOW_TOP: 1
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - socket
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  bifrost:
    # nosemgrep
    image: maximhq/bifrost:v1.6.11@sha256:ef8e686b3588884066ec3d0e57f3fc15136b11047ad94678adefe5a9573539af
    working_dir: /app/data
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/bifrost:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth bifrost bifrost:8080"
      pangolin.public-resources.bifrost.name: bifrost
      pangolin.public-resources.bifrost.mode: http
      pangolin.public-resources.bifrost.full-domain: "bifrost.${DOMAIN:?}"
      pangolin.public-resources.bifrost.auth.sso-enabled: true
      pangolin.public-resources.bifrost.targets[0].hostname: bifrost
      pangolin.public-resources.bifrost.targets[0].port: 8080
      pangolin.public-resources.bifrost.targets[0].method: http

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:1.14.0@sha256:86c79eed8a6b3a78859f73bc70d6003c5566b85e969354ec454524b28197ffce
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?}
      ENABLE_VNC: 1
      VNC_BIND: 0.0.0.0
      VNC_PASSWORD: ${CAMOFOX_VNC_PASSWORD:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/camofox:/root/.camofox
    expose:
      - 6080
      - 9377
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9377/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth camofox camofox:6080"
      pangolin.public-resources.camofox.name: camofox
      pangolin.public-resources.camofox.mode: http
      pangolin.public-resources.camofox.full-domain: "camofox.${DOMAIN:?}"
      pangolin.public-resources.camofox.auth.sso-enabled: true
      pangolin.public-resources.camofox.targets[0].hostname: camofox
      pangolin.public-resources.camofox.targets[0].port: 6080
      pangolin.public-resources.camofox.targets[0].method: http

  fastcrw:
    # nosemgrep
    image: ghcr.io/us/crw:0.32.0@sha256:f2619c0fa061045f369088f5ae5b4d5f53d1b012c54cb50e612af70ec08d264a
    environment:
      CRW_CONFIG: config.docker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/3000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth fastcrw fastcrw:3000"

  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:8d91cb8e6c092039b44d9aafbd2d20c9d0e969b2c2ee4293f2c7b503784f1cd9
    command:
      - --file=/input/settings.template.yml
      - --out=/output/settings.yml
    environment:
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:?}
      EXA_API_KEY: ${EXA_API_KEY:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./searxng:/input:ro
      - /apps/searxng:/output
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.10-0a118066d@sha256:cd22dbf7fac8b25d5e39e65af53a4b47009df5ad3162e270c477fd5b30ce03f2
    depends_on:
      gomplate:
        condition: service_completed_successfully
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://searxng.${DOMAIN:?}}
    cap_add:
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - /apps/searxng/cache:/var/cache/searxng
    expose:
      - 8080
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth searxng searxng:8080"
      pangolin.public-resources.searxng.name: searxng
      pangolin.public-resources.searxng.mode: http
      pangolin.public-resources.searxng.full-domain: "searxng.${DOMAIN:?}"
      pangolin.public-resources.searxng.auth.sso-enabled: true
      pangolin.public-resources.searxng.targets[0].hostname: searxng
      pangolin.public-resources.searxng.targets[0].port: 8080
      pangolin.public-resources.searxng.targets[0].method: http

  lightpanda:
    image: lightpanda/browser:0.3.7@sha256:eae2c7f8ff39a7a24540d21c7561ce219fd14b1bf2b92403930c6d140f2d1337
    command: [lightpanda, serve, --host, 0.0.0.0, --advertise-host, lightpanda]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /home/lightpanda:mode=1777
    expose:
      - 9222
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/9222"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth lightpanda lightpanda:9222"

  chrome:
    # nosemgrep
    image: chromedp/headless-shell:152.0.7939.3@sha256:f7e7ac721b023cb8717f8108aef8b3e49995fb1e5a912f41e570c29e45d24961
    command:
      - --remote-allow-origins=*
      - --ignore-certificate-errors
      - --disable-http2
      - --disable-blink-features=AutomationControlled
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 4g
    tmpfs:
      - /tmp:size=512m
    expose:
      - 9222
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/9222"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth chrome chrome:9222"

networks:
  default:
    name: proxy
    external: true
  socket:
    internal: true
