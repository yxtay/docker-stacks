services:
  hermes:
    # nosemgrep
    image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
    command: gateway run
    working_dir: /opt/data
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.${DOMAIN:?}}
      DOCKER_HOST: tcp://socket-proxy:2375
    env_file:
      - .env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/hermes:/opt/data
      - /apps/:/apps:ro
      - /home/ubuntu/docker-stacks/:/opt/data/home/docker-stacks:ro
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8642
      - 9119
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9119/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      caddy.import_1: reverse_proxy_auth hermes-api hermes:8642
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http
      pangolin.public-resources.hermes-api.name: hermes-api
      pangolin.public-resources.hermes-api.mode: http
      pangolin.public-resources.hermes-api.full-domain: "hermes-api.${DOMAIN:?}"
      pangolin.public-resources.hermes-api.auth.sso-enabled: true
      pangolin.public-resources.hermes-api.targets[0].hostname: hermes
      pangolin.public-resources.hermes-api.targets[0].port: 8642
      pangolin.public-resources.hermes-api.targets[0].method: http

  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.2@sha256:b3c91258489c6d6ef26f20e9681177e3e861798466a2b85a3572ee0464c5e088
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - default
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  litellm:
    # nosemgrep
    image: docker.litellm.ai/berriai/litellm:v1.94.0@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
    depends_on:
      db:
        condition: service_healthy
    command:
      - --config=/app/config.yaml
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?}
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    tmpfs:
      - /app/cache
      - /app/migrations
      - /tmp
    expose:
      - 4000
    networks:
      - proxy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth litellm litellm:4000"
      pangolin.public-resources.litellm.name: litellm
      pangolin.public-resources.litellm.mode: http
      pangolin.public-resources.litellm.full-domain: "litellm.${DOMAIN:?}"
      pangolin.public-resources.litellm.auth.sso-enabled: true
      pangolin.public-resources.litellm.targets[0].hostname: litellm
      pangolin.public-resources.litellm.targets[0].port: 4000
      pangolin.public-resources.litellm.targets[0].method: http

  headroom:
    image: ghcr.io/chopratejas/headroom:0.27.0-code@sha256:e86f664eca715ca53505f3f2c73a66d82aa56d3d09b39bb2b75f6b131f3e1568
    environment:
      HEADROOM_TELEMETRY: "off"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    expose:
      - 8787
    networks:
      - proxy
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8787/readyz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth headroom headroom:8787"
      pangolin.public-resources.headroom.name: headroom
      pangolin.public-resources.headroom.mode: http
      pangolin.public-resources.headroom.full-domain: "headroom.${DOMAIN:?}"
      pangolin.public-resources.headroom.auth.sso-enabled: true
      pangolin.public-resources.headroom.targets[0].hostname: headroom
      pangolin.public-resources.headroom.targets[0].port: 8787
      pangolin.public-resources.headroom.targets[0].method: http

  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      PGUSER: ${PGUSER:-litellm}
      PGDATABASE: ${PGDATABASE:-litellm}
      POSTGRES_INITDB_ARGS: --data-checksums
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/litellm:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    networks:
      - litellm
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: agent
  proxy:
    name: proxy
    external: true
  litellm:
    internal: true
