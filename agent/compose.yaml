services:
  hermes:
    # nosemgrep
    image: nousresearch/hermes-agent:v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
    command: gateway run
    working_dir: /opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.${DOMAIN:?}}
      HERMES_WRITE_SAFE_ROOT: /opt/data:/tmp
      MNEMOSYNE_CROSS_SESSION: 1
      MNEMOSYNE_DEFAULT_SCOPE: global
      MNEMOSYNE_LLM_ENABLED: 1
      MNEMOSYNE_LLM_BASE_URL: http://bifrost:8080/v1
      MNEMOSYNE_LLM_MODEL: auto
      CAMOFOX_URL: http://camofox:9377
      DOCKER_HOST: tcp://socket-proxy:2375
      FIRECRAWL_API_URL: http://fastcrw:3000
      SEARXNG_URL: http://searxng:8080
      OBSIDIAN_VAULT_PATH: /opt/data/wiki
      WIKI_PATH: /opt/data/wiki
    env_file:
      - .env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/hermes:/opt/data
      - /apps/hermes/profile.d/hermes-path.sh:/etc/profile.d/hermes-path.sh:ro
      - /apps/:/apps:ro
      - /home/ubuntu/docker-stacks/:/opt/data/home/docker-stacks:ro
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8642
      - 9119
    networks:
      - default
      - socket
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9119/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http

  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.3@sha256:a6b52255f881951c3cb6b6cce78c3d91435ed201cf16ab77bfe92e9a8ee13121
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - socket
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  bifrost:
    # nosemgrep
    image: maximhq/bifrost:v1.6.10@sha256:866d756018ddbe3e088873179815fca38b94b5c20d65d65ba3734d446ab22deb
    working_dir: /app/data
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/bifrost:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth bifrost bifrost:8080"
      pangolin.public-resources.bifrost.name: bifrost
      pangolin.public-resources.bifrost.mode: http
      pangolin.public-resources.bifrost.full-domain: "bifrost.${DOMAIN:?}"
      pangolin.public-resources.bifrost.auth.sso-enabled: true
      pangolin.public-resources.bifrost.targets[0].hostname: bifrost
      pangolin.public-resources.bifrost.targets[0].port: 8080
      pangolin.public-resources.bifrost.targets[0].method: http

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:1.13.0@sha256:64b30ffdbbc4ae0e28200a66dfbd6f55ac4188229eb34ef769afcf7be40faa6e
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?}
      ENABLE_VNC: 1
      VNC_BIND: 0.0.0.0
      VNC_PASSWORD: ${CAMOFOX_VNC_PASSWORD:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/camofox:/root/.camofox
    expose:
      - 6080
      - 9377
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9377/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth camofox camofox:6080"
      pangolin.public-resources.camofox.name: camofox
      pangolin.public-resources.camofox.mode: http
      pangolin.public-resources.camofox.full-domain: "camofox.${DOMAIN:?}"
      pangolin.public-resources.camofox.auth.sso-enabled: true
      pangolin.public-resources.camofox.targets[0].hostname: camofox
      pangolin.public-resources.camofox.targets[0].port: 6080
      pangolin.public-resources.camofox.targets[0].method: http

  fastcrw:
    # nosemgrep
    image: ghcr.io/us/crw:0.30.0@sha256:24ab5cf54456183265f7acb060b693a3d2f1e24f4f6a1f3df0742df1fcc0f6aa
    environment:
      CRW_EXTRACTION__LLM__BASE_URL: http://bifrost:8080/v1
      CRW_EXTRACTION__LLM__API_KEY: bifrost
      CRW_EXTRACTION__LLM__MODEL: auto
      CRW_EXTRACTION__LLM_FALLBACK__ENABLE: 1
      CRW_RENDERER__LIGHTPANDA__WS_URL: ws://lightpanda:9222
      CRW_SEARCH__SEARXNG_URL: http://searxng:8080
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/3000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth fastcrw fastcrw:3000"

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.10-0a118066d@sha256:cd22dbf7fac8b25d5e39e65af53a4b47009df5ad3162e270c477fd5b30ce03f2
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://searxng.${DOMAIN:?}}
    cap_add:
      - CHOWN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - /apps/searxng/cache:/var/cache/searxng
    expose:
      - 8080
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth searxng searxng:8080"
      pangolin.public-resources.searxng.name: searxng
      pangolin.public-resources.searxng.mode: http
      pangolin.public-resources.searxng.full-domain: "searxng.${DOMAIN:?}"
      pangolin.public-resources.searxng.auth.sso-enabled: true
      pangolin.public-resources.searxng.targets[0].hostname: searxng
      pangolin.public-resources.searxng.targets[0].port: 8080
      pangolin.public-resources.searxng.targets[0].method: http

  lightpanda:
    image: lightpanda/browser:0.3.6@sha256:bf2328538effa8392166d0cbdba9943a2c97fd19cd2e75b88c8c6f0cf03a1beb
    command: [lightpanda, serve, --host, 0.0.0.0, --advertise-host, lightpanda]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /home/lightpanda:mode=1777
    expose:
      - 9222
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/9222"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth lightpanda lightpanda:9222"

networks:
  default:
    name: proxy
    external: true
  socket:
    internal: true
