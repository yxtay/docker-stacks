services:
  hermes:
    # nosemgrep
    image: nousresearch/hermes-agent:v2026.7.30@sha256:b869e64d6496d4763d5e4fb675b5f504cb23b0e35ec9b790481a56118602b10f
    command: gateway run
    working_dir: /opt/data
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.${DOMAIN:?}}
      DOCKER_HOST: tcp://socket-proxy:2375
      CAMOFOX_URL: http://camofox:9377
    env_file:
      - .env
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/hermes:/opt/data
      - /apps/:/apps:ro
      - /home/ubuntu/docker-stacks/:/opt/data/home/docker-stacks:ro
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8642
      - 9119
    networks:
      - default
      - socket
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9119/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      caddy.import_1: reverse_proxy_auth hermes-api hermes:8642
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http
      pangolin.public-resources.hermes.targets[1].hostname: hermes
      pangolin.public-resources.hermes.targets[1].port: 8642
      pangolin.public-resources.hermes.targets[1].method: http
      pangolin.public-resources.hermes.targets[1].path: /v1
      pangolin.public-resources.hermes.targets[1].path-match: prefix

  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.3@sha256:5253050dd304d351df2ee61bba43c57dd2b19bb640497a679592051de3a3c639
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - socket
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  bifrost:
    # nosemgrep
    image: maximhq/bifrost:v1.6.7@sha256:bf2208978308477a9f667dfc04cef3153197aeaca8618befefbecde3ed3378b7
    working_dir: /app/data
    depends_on:
      headroom:
        condition: service_healthy
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/bifrost:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth bifrost bifrost:8080"
      pangolin.public-resources.bifrost.name: bifrost
      pangolin.public-resources.bifrost.mode: http
      pangolin.public-resources.bifrost.full-domain: "bifrost.${DOMAIN:?}"
      pangolin.public-resources.bifrost.auth.sso-enabled: true
      pangolin.public-resources.bifrost.targets[0].hostname: bifrost
      pangolin.public-resources.bifrost.targets[0].port: 8080
      pangolin.public-resources.bifrost.targets[0].method: http

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.33.0-code@sha256:f450aa2de66ead24e65223ac8763efca2b87725b04e4ac8fd21a4d05af775099
    environment:
      HEADROOM_COMPRESS_ALLOW_REMOTE: 1
      HEADROOM_NO_CCR: 1
      HEADROOM_OUTPUT_SHAPER: 1
      HEADROOM_SAVINGS_PROFILE: coding
      HEADROOM_SKIP_UPSTREAM_CHECK: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/headroom:/home/nonroot/.headroom
      # - /apps/headroom/.cache:/root/.cache
    tmpfs:
      - /tmp
    expose:
      - 8787
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth headroom headroom:8787"
      pangolin.public-resources.headroom.name: headroom
      pangolin.public-resources.headroom.mode: http
      pangolin.public-resources.headroom.full-domain: "headroom.${DOMAIN:?}"
      pangolin.public-resources.headroom.auth.sso-enabled: true
      pangolin.public-resources.headroom.targets[0].hostname: headroom
      pangolin.public-resources.headroom.targets[0].port: 8787
      pangolin.public-resources.headroom.targets[0].method: http

  camofox:
    image: ghcr.io/jo-inc/camofox-browser:1.13.0@sha256:64b30ffdbbc4ae0e28200a66dfbd6f55ac4188229eb34ef769afcf7be40faa6e
    environment:
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:?}
      ENABLE_VNC: 1
      VNC_BIND: 0.0.0.0
      VNC_PASSWORD: ${CAMOFOX_VNC_PASSWORD:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/camofox:/root/.camofox
    expose:
      - 5900
      - 6080
      - 9377
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9377/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth camofox camofox:6080"
      pangolin.public-resources.camofox.name: camofox
      pangolin.public-resources.camofox.mode: http
      pangolin.public-resources.camofox.full-domain: "camofox.${DOMAIN:?}"
      pangolin.public-resources.camofox.auth.sso-enabled: true
      pangolin.public-resources.camofox.targets[0].hostname: camofox
      pangolin.public-resources.camofox.targets[0].port: 6080
      pangolin.public-resources.camofox.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
  socket:
    internal: true
