services:
  hermes:
    # nosemgrep
    image: nousresearch/hermes-agent:v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
    command: gateway run
    working_dir: /opt/data
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-https://hermes.${DOMAIN:?}}
      DOCKER_HOST: tcp://socket-proxy:2375
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/hermes:/opt/data
      - /apps/:/apps:ro
      - /home/ubuntu/docker-stacks/:/opt/data/home/docker-stacks:ro
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8642
      - 9119
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9119/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      caddy.import_1: reverse_proxy_auth hermes-api hermes:8642
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http
      pangolin.public-resources.hermes-api.name: hermes-api
      pangolin.public-resources.hermes-api.mode: http
      pangolin.public-resources.hermes-api.full-domain: "hermes-api.${DOMAIN:?}"
      pangolin.public-resources.hermes-api.auth.sso-enabled: true
      pangolin.public-resources.hermes-api.targets[0].hostname: hermes
      pangolin.public-resources.hermes-api.targets[0].port: 8642
      pangolin.public-resources.hermes-api.targets[0].method: http

  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.2@sha256:b3c91258489c6d6ef26f20e9681177e3e861798466a2b85a3572ee0464c5e088
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - default
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  manifest:
    image: manifestdotbuild/manifest:6.16.0@sha256:a73989a9c9652c35f8fb16e835222c6fb7a8765e7f5493a1fdb98a3abdc19a45
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 2099
      DATABASE_URL: ${DATABASE_URL:-postgresql://manifest:manifest@postgres:5432/manifest}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://manifest.${DOMAIN:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - 2099
    networks:
      - manifest
      - proxy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const p=process.env.PORT||'2099';fetch(`http://127.0.0.1:$${p}/api/v1/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: "reverse_proxy_auth manifest manifest:2099"
      pangolin.public-resources.manifest.name: manifest
      pangolin.public-resources.manifest.mode: http
      pangolin.public-resources.manifest.full-domain: "manifest.${DOMAIN:?}"
      pangolin.public-resources.manifest.auth.sso-enabled: true
      pangolin.public-resources.manifest.targets[0].hostname: manifest
      pangolin.public-resources.manifest.targets[0].port: 2099
      pangolin.public-resources.manifest.targets[0].method: http

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manifest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manifest}
      POSTGRES_DB: ${POSTGRES_DB:-manifest}
      PGUSER: ${PGUSER:-manifest}
      PGDATABASE: ${PGDATABASE:-manifest}
      POSTGRES_INITDB_ARGS: --data-checksums
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/manifest:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    networks:
      - manifest
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: agent
  proxy:
    name: proxy
    external: true
  manifest:
    internal: true
