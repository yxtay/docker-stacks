general_settings:
  store_model_in_db: true
  cancel_on_disconnect: true
  user_api_key_cache_ttl: 300

litellm_settings:
  json_logs: true
  request_timeout: 60
  drop_params: true
  cache: true
  cache_params:
    type: local
    ttl: 3600

router_settings:
  cooldown_time: 60
  allowed_fails: 3
  enable_pre_call_checks: true
  default_fallbacks: ["deepseek-v4-flash:free"]
  fallbacks:
    - deepseek-v4-flash:free: ["mimo-v2.5:free"]
    - hy3:free: ["deepseek-v4-flash:free"]
    - mimo-v2.5:free: ["deepseek-v4-flash:free"]

model_list:
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: deepseek-v4-flash:free
          MEDIUM: deepseek-v4-flash:free
          COMPLEX: deepseek-v4-flash:free
          REASONING: deepseek-v4-flash:free
        adaptive: true
        complexity_router_default_model: deepseek-v4-flash:free

  - model_name: gemma-4-31b
    litellm_params:
      model: cerebras/gemma-4-31b

  - model_name: gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest

  - model_name: gemma-4-31b-it
    litellm_params:
      model: gemini/gemma-4-31b-it

  - model_name: gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b

  - model_name: hy3:free
    litellm_params:
      model: openai/tencent/hy3:free
      litellm_credential_name: nous

  - model_name: deepseek-v4-flash:high
    litellm_params:
      model: openai/deepseek-v4-flash
      reasoning_effort: high
      litellm_credential_name: opencode_go

  - model_name: deepseek-v4-flash:max
    litellm_params:
      model: openai/deepseek-v4-flash
      reasoning_effort: max
      litellm_credential_name: opencode_go

  - model_name: deepseek-v4-pro:max
    litellm_params:
      model: openai/deepseek-v4-pro
      reasoning_effort: max
      litellm_credential_name: opencode_go

  - model_name: deepseek-v4-flash:free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      reasoning_effort: max
      litellm_credential_name: opencode_zen

  - model_name: mimo-v2.5:free
    litellm_params:
      model: openai/mimo-v2.5-free
      litellm_credential_name: opencode_zen

  - model_name: openrouter:free
    litellm_params:
      model: openrouter/openrouter/free

credential_list:
  - credential_name: nous
    credential_values:
      api_key: os.environ/NOUS_API_KEY
      api_base: http://headroom:8787
      extra_headers:
        x-headroom-base-url: https://inference-api.nousresearch.com/v1
    credential_info: {}

  - credential_name: opencode_zen
    credential_values:
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      api_base: http://headroom:8787
      extra_headers:
        x-headroom-base-url: https://opencode.ai/zen/v1
    credential_info: {}

  - credential_name: opencode_go
    credential_values:
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: http://headroom:8787
      extra_headers:
        x-headroom-base-url: https://opencode.ai/zen/go/v1
    credential_info: {}

guardrails:
  - guardrail_name: headroom
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://headroom:8787
