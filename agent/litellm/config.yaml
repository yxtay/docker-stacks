general_settings:
  store_model_in_db: true
  cancel_on_disconnect: true

litellm_settings:
  json_logs: true
  request_timeout: 60
  drop_params: true

router_settings:
  cooldown_time: 60
  allowed_fails: 3
  ttft_timeout: 30
  enable_pre_call_checks: true
  optional_pre_call_checks: [prompt_caching]
  enable_anthropic_prompt_caching: true
  default_litellm_params:
    cache_control_injection_points:
      - location: message
        role: system
  default_fallbacks: [complex, medium, simple]
  fallbacks:
    - reasoning: [complex, medium, simple]
    - complex: [medium, simple]
    - medium: [simple]

model_list:
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: simple
          MEDIUM: medium
          COMPLEX: complex
          REASONING: reasoning
      adaptive: true
      session_affinity: true
      complexity_router_default_model: complex

  - model_name: simple
    litellm_params:
      model: openai/deepseek-v4-flash-free
      litellm_credential_name: opencode_zen

  - model_name: medium
    litellm_params:
      model: openai/deepseek-v4-flash-free
      litellm_credential_name: opencode_zen

  - model_name: complex
    litellm_params:
      model: openai/deepseek-v4-flash-free
      litellm_credential_name: opencode_zen

  - model_name: reasoning
    litellm_params:
      model: openai/deepseek-v4-flash-free
      litellm_credential_name: opencode_zen

  - model_name: cerebras/gemma-4-31b
    litellm_params:
      model: cerebras/gemma-4-31b

  - model_name: gemini/gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest

  - model_name: gemini/gemma-4-31b-it
    litellm_params:
      model: gemini/gemma-4-31b-it

  - model_name: groq/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b

  - model_name: opencode-zen/deepseek-v4-flash-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      litellm_credential_name: opencode_zen

  - model_name: opencode-zen/mimo-v2.5-free
    litellm_params:
      model: openai/mimo-v2.5-free
      litellm_credential_name: opencode_zen

  - model_name: openrouter/free
    litellm_params:
      model: openrouter/openrouter/free

credential_list:
  - credential_name: nous
    credential_values:
      api_key: os.environ/NOUS_API_KEY
      api_base: https://inference-api.nousresearch.com/v1
    credential_info: {}

  - credential_name: opencode_zen
    credential_values:
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      api_base: https://opencode.ai/zen/v1
    credential_info: {}

  - credential_name: opencode_go
    credential_values:
      api_key: os.environ/OPENCODE_GO_API_KEY
      api_base: https://opencode.ai/zen/go/v1
    credential_info: {}

guardrails:
  - guardrail_name: headroom
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: http://headroom:8787
      api_key: os.environ/LITELLM_MASTER_KEY
      # default_on: true
