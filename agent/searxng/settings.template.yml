# SearXNG user settings
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

engines:
  - name: braveapi
    api_key: "{{ .Env.BRAVE_SEARCH_API_KEY }}"
    inactive: false
  - name: exaapi
    api_key: "{{ .Env.EXA_API_KEY }}"
    inactive: false
  - name: wikidata
    timeout: 10

search:
  formats:
    - html
    - json
    - csv
    - rss

server:
  image_proxy: true

outgoing:
  useragent_suffix: +https://github.com/yxtay
