# SearXNG user settings
use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

engines:
  - name: wikidata
    timeout: 10

search:
  formats:
    - html
    - json
    - csv
    - rss

server:
  image_proxy: true

outgoing:
  useragent_suffix: "{{ .Env.SEARXNG_USERAGENT_SUFFIX }}"
