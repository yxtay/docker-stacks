services:
  socket-proxy:
    # nosemgrep
    image: ghcr.io/linuxserver/socket-proxy:3.4.2@sha256:a9de14c1c9697de5384a63c2a8e1fdbb823d74f03c94cde77c59e149169c0326
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    networks:
      - default
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  hermes:
    image: nousresearch/hermes-agent:v2026.6.5
    command: gateway run
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-}
      HERMES_DASHBOARD_OAUTH_PORTAL_URL: ${HERMES_DASHBOARD_PUBLIC_URL:-}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      DOCKER_HOST: tcp://socket-proxy:2375
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/hermes:/opt/data
    expose:
      - 8642
      - 9119
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, hermes, doctor]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import_0: reverse_proxy_auth hermes hermes:9119
      caddy.import_1: reverse_proxy_auth hermes-api hermes:8642
      pangolin.public-resources.hermes.name: hermes
      pangolin.public-resources.hermes.mode: http
      pangolin.public-resources.hermes.full-domain: "hermes.${DOMAIN:?}"
      pangolin.public-resources.hermes.auth.sso-enabled: true
      pangolin.public-resources.hermes.targets[0].hostname: hermes
      pangolin.public-resources.hermes.targets[0].port: 9119
      pangolin.public-resources.hermes.targets[0].method: http
      pangolin.public-resources.hermes-api.name: hermes-api
      pangolin.public-resources.hermes-api.mode: http
      pangolin.public-resources.hermes-api.full-domain: "hermes-api.${DOMAIN:?}"
      pangolin.public-resources.hermes-api.auth.sso-enabled: true
      pangolin.public-resources.hermes-api.targets[0].hostname: hermes
      pangolin.public-resources.hermes-api.targets[0].port: 8642
      pangolin.public-resources.hermes-api.targets[0].method: http

networks:
  default:
    internal: true
  proxy:
    name: proxy
    external: true
