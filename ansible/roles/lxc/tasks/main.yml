- name: Configure subuid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:{{ lxc_idmap_start }}:{{ lxc_idmap_count }}"
    create: true
    mode: "0644"

- name: Configure subgid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:{{ lxc_idmap_start }}:{{ lxc_idmap_count }}"
    create: true
    mode: "0644"

- name: Download LXC template
  community.proxmox.proxmox_template:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    node: "{{ inventory_hostname }}"
    storage: "{{ lxc_template_storage }}"
    template: "{{ lxc_template }}"
    content_type: vztmpl
    validate_certs: false
    state: present
  delegate_to: localhost

- name: Create LXC container
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: false
    vmid: "{{ lxc_vmid }}"
    hostname: "{{ lxc_hostname }}"
    node: "{{ inventory_hostname }}"
    ostemplate: "{{ lxc_template_storage }}:vztmpl/{{ lxc_template }}"
    storage: "{{ lxc_storage }}"
    disk: "{{ lxc_disk }}"
    cores: "{{ lxc_cores }}"
    memory: "{{ lxc_memory }}"
    swap: "{{ lxc_swap }}"
    netif: '{"net0":"name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"}'
    features: "{{ lxc_features }}"
    pubkey: "{{ ssh_public_key }}"
    unprivileged: true
    onboot: true
    state: present
  delegate_to: localhost

- name: Configure ID mapping in LXC config
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ lxc_vmid }}.conf"
    line: "{{ item.line }}"
    regexp: "{{ item.regexp }}"
    state: present
  loop:
    - line: "lxc.idmap: u 0 100000 {{ lxc_idmap_start | int }}"
      regexp: '^lxc\.idmap:\s+u\s+0\s+'
    - line: "lxc.idmap: g 0 100000 {{ lxc_idmap_start | int }}"
      regexp: '^lxc\.idmap:\s+g\s+0\s+'
    - line: "lxc.idmap: u {{ lxc_idmap_start | int }} {{ lxc_idmap_start | int }} {{ lxc_idmap_count | int }}"
      regexp: '^lxc\.idmap:\s+u\s+{{ lxc_idmap_start | int }}\s+'
    - line: "lxc.idmap: g {{ lxc_idmap_start | int }} {{ lxc_idmap_start | int }} {{ lxc_idmap_count | int }}"
      regexp: '^lxc\.idmap:\s+g\s+{{ lxc_idmap_start | int }}\s+'
    - line: "lxc.idmap: u {{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 100000 + (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 65536 - (lxc_idmap_start | int) - (lxc_idmap_count | int) }}"
      regexp: '^lxc\.idmap:\s+u\s+{{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }}\s+'
    - line: "lxc.idmap: g {{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 100000 + (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 65536 - (lxc_idmap_start | int) - (lxc_idmap_count | int) }}"
      regexp: '^lxc\.idmap:\s+g\s+{{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }}\s+'
  register: idmap_config

- name: Stop LXC container for ID mapping change
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: false
    vmid: "{{ lxc_vmid }}"
    state: stopped
    force: true
  delegate_to: localhost
  when: idmap_config is changed

- name: Start LXC container
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: false
    vmid: "{{ lxc_vmid }}"
    state: started
  delegate_to: localhost
