- name: Configure subuid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:{{ item }}:1"
    regexp: "^root:{{ item }}:"
    create: true
    mode: "0644"
  loop: "{{ lxc_idmap_uids }}"

- name: Configure subgid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:{{ item }}:1"
    regexp: "^root:{{ item }}:"
    create: true
    mode: "0644"
  loop: "{{ lxc_idmap_gids }}"

- name: Download LXC template
  community.proxmox.proxmox_template:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    node: "{{ inventory_hostname }}"
    storage: "{{ lxc_template_storage }}"
    template: "{{ lxc_template }}"
    content_type: vztmpl
    validate_certs: "{{ pve_api_validate_certs | default(false) }}"
    state: present
  delegate_to: localhost

- name: Create LXC container
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: "{{ pve_api_validate_certs | default(false) }}"
    vmid: "{{ lxc_vmid }}"
    hostname: "{{ lxc_hostname }}"
    node: "{{ inventory_hostname }}"
    ostemplate: "{{ lxc_template_storage }}:vztmpl/{{ lxc_template }}"
    disk: "{{ lxc_disk }}"
    cores: "{{ lxc_cores }}"
    memory: "{{ lxc_memory }}"
    swap: "{{ lxc_swap }}"
    netif:
      net0: "name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"
    features: "{{ lxc_features }}"
    pubkey: "{{ ssh_public_key }}"
    unprivileged: true
    onboot: true
    cmode: tty
    state: present
  delegate_to: localhost

- name: Remove existing ID mapping from LXC config
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ lxc_vmid }}.conf"
    regexp: '^lxc\.idmap:'
    state: absent

- name: Configure ID mapping in LXC config
  vars:
    _uids: "{{ lxc_idmap_uids | map('int') | sort | list }}"
    _gids: "{{ lxc_idmap_gids | map('int') | sort | list }}"
    _uid_lines: >-
      {% set lines = [] %}
      {% for uid in _uids %}
      {% set prev_end = 0 if loop.index0 == 0 else _uids[loop.index0 - 1] + 1 %}
      {% if uid > prev_end %}
      {% if lines.append('lxc.idmap: u ' ~ prev_end ~ ' ' ~ (100000 + prev_end) ~ ' ' ~ (uid - prev_end)) %}{% endif %}
      {% endif %}
      {% if lines.append('lxc.idmap: u ' ~ uid ~ ' ' ~ uid ~ ' 1') %}{% endif %}
      {% endfor %}
      {% set tail_start = _uids[-1] + 1 if _uids else 0 %}
      {% if tail_start < 65536 %}
      {% if lines.append('lxc.idmap: u ' ~ tail_start ~ ' ' ~ (100000 + tail_start) ~ ' ' ~ (65536 - tail_start)) %}{% endif %}
      {% endif %}
      {{ lines | to_json }}
    _gid_lines: >-
      {% set lines = [] %}
      {% for gid in _gids %}
      {% set prev_end = 0 if loop.index0 == 0 else _gids[loop.index0 - 1] + 1 %}
      {% if gid > prev_end %}
      {% if lines.append('lxc.idmap: g ' ~ prev_end ~ ' ' ~ (100000 + prev_end) ~ ' ' ~ (gid - prev_end)) %}{% endif %}
      {% endif %}
      {% if lines.append('lxc.idmap: g ' ~ gid ~ ' ' ~ gid ~ ' 1') %}{% endif %}
      {% endfor %}
      {% set tail_start = _gids[-1] + 1 if _gids else 0 %}
      {% if tail_start < 65536 %}
      {% if lines.append('lxc.idmap: g ' ~ tail_start ~ ' ' ~ (100000 + tail_start) ~ ' ' ~ (65536 - tail_start)) %}{% endif %}
      {% endif %}
      {{ lines | to_json }}
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ lxc_vmid }}.conf"
    line: "{{ item }}"
    state: present
  loop: "{{ (_uid_lines | from_json) + (_gid_lines | from_json) }}"
  register: idmap_config

- name: Stop LXC container for ID mapping change
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: "{{ pve_api_validate_certs | default(false) }}"
    vmid: "{{ lxc_vmid }}"
    state: stopped
    force: true
  delegate_to: localhost
  when: idmap_config is changed

- name: Start LXC container
  community.proxmox.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    validate_certs: "{{ pve_api_validate_certs | default(false) }}"
    vmid: "{{ lxc_vmid }}"
    state: started
  delegate_to: localhost
