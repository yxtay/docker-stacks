- name: Configure subuid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:{{ lxc_idmap_start }}:{{ lxc_idmap_count }}"
    create: true
    mode: "0644"

- name: Configure subgid for ID mapping
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:{{ lxc_idmap_start }}:{{ lxc_idmap_count }}"
    create: true
    mode: "0644"

- name: Download LXC template
  ansible.builtin.command:
    cmd: pveam download {{ lxc_template_storage }} {{ lxc_template }}
    creates: /var/lib/vz/template/cache/{{ lxc_template }}

- name: Create LXC container
  community.general.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    vmid: "{{ lxc_vmid }}"
    hostname: "{{ lxc_hostname }}"
    node: "{{ inventory_hostname }}"
    ostemplate: "{{ lxc_template_storage }}:vztmpl/{{ lxc_template }}"
    storage: "{{ lxc_storage }}"
    disk: "{{ lxc_disk }}"
    cores: "{{ lxc_cores }}"
    memory: "{{ lxc_memory }}"
    swap: "{{ lxc_swap }}"
    netif: '{"net0":"name=eth0,bridge={{ lxc_bridge }},ip={{ lxc_ip }},gw={{ lxc_gateway }}"}'
    features: "{{ lxc_features }}"
    unprivileged: true
    onboot: true
    state: present

- name: Configure ID mapping in LXC config
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ lxc_vmid }}.conf"
    marker: "# {mark} ANSIBLE ID MAPPING"
    block: |
      lxc.idmap: u 0 100000 {{ lxc_idmap_start | int }}
      lxc.idmap: g 0 100000 {{ lxc_idmap_start | int }}
      lxc.idmap: u {{ lxc_idmap_start | int }} {{ lxc_idmap_start | int }} {{ lxc_idmap_count | int }}
      lxc.idmap: g {{ lxc_idmap_start | int }} {{ lxc_idmap_start | int }} {{ lxc_idmap_count | int }}
      lxc.idmap: u {{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 100000 + (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 65536 - (lxc_idmap_start | int) - (lxc_idmap_count | int) }}
      lxc.idmap: g {{ (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 100000 + (lxc_idmap_start | int) + (lxc_idmap_count | int) }} {{ 65536 - (lxc_idmap_start | int) - (lxc_idmap_count | int) }}
  register: idmap_config

- name: Stop LXC container for ID mapping change
  community.general.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    vmid: "{{ lxc_vmid }}"
    state: stopped
    force: true
  when: idmap_config.changed

- name: Start LXC container
  community.general.proxmox:
    api_host: "{{ pve_api_host }}"
    api_user: "{{ pve_api_user }}"
    api_password: "{{ pve_api_password }}"
    vmid: "{{ lxc_vmid }}"
    state: started

- name: Wait for container to be running
  ansible.builtin.command:
    cmd: pct status {{ lxc_vmid }}
  register: pct_status
  until: "'running' in pct_status.stdout"
  retries: 10
  delay: 3
  changed_when: false
