services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/arcane:/app/data
      - /apps/arcane/cache:/builds
      - /apps/arcane/backups:/backups
      - ${COMPOSE_DIR:-${HOME}}:${COMPOSE_DIR:-${HOME}}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - JWT_SECRET=${JWT_SECRET:?}
    ports:
      - 3552:3552
    healthcheck:
      test: [CMD, /app/arcane, health]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth arcane arcane:3552

volumes:
  arcane-data:
