services:
  arcane:
    # nosemgrep
    image: ghcr.io/getarcaneapp/manager:v3.0.0@sha256:5641899b379ff20e856efb8e3507f2c871a5ab9282d56854eac7028f256bfce3
    environment:
      ARCANE_APP_URL: ${ARCANE_APP_URL:-http://localhost:3552}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      ARCANE_ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY:?}
      ARCANE_LOG_JSON: true
      # Docker default networks
      ARCANE_TRUSTED_PROXIES: 172.16.0.0/12
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/arcane/data:/app/data
      - /apps/arcane/cache:/builds
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp
    ports:
      - 3552:3552
    healthcheck:
      test: [CMD, /app/arcane, health]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth arcane arcane:3552

networks:
  default:
    name: proxy
    external: true
