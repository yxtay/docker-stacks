services:
  resticprofile:
    image: creativeprojects/resticprofile:0.29.0
    entrypoint: [sh]
    command: [resticprofile schedule --all && crond -f]
    environment:
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
    secrets:
      - google_service_account
      - restic_password
    volumes:
      - ./resticprofile:/resticprofile:ro
      - /apps:/apps:ro
      - /apps/resticprofile/cache:/var/cache/restic
    restart: unless-stopped

secrets:
  google_service_account:
    environment: GOOGLE_SERVICE_ACCOUNT_JSON
  restic_password:
    environment: RESTIC_PASSWORD
