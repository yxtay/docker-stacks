services:
  resticprofile:
    # nosemgrep
    image: creativeprojects/resticprofile:0.33.1@sha256:2dd6820c345794cd8ea6b736e02070e85940c67de3a9f5002f57c47052080616
    entrypoint: [sh]
    command: >-
      -c "resticprofile schedule --all && exec crond -f -L /dev/stdout"
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:?}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:?}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    secrets:
      - restic_password
    volumes:
      - ./resticprofile:/resticprofile:ro
      - /apps/rclone:/config/rclone
      - /apps:/apps:ro
      - /backups/restic:/backup
      - /apps/resticprofile/cache:/var/cache/restic
    uts: host
    healthcheck:
      test: [CMD, resticprofile, --dry-run, backup]
    restart: unless-stopped

networks:
  default:
    name: caddy
    external: true

secrets:
  restic_password:
    environment: RESTIC_PASSWORD
