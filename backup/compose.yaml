services:
  resticprofile:
    image: creativeprojects/resticprofile:0.29.0
    entrypoint: [sh]
    command: >-
      -c "resticprofile schedule --all && crond -f"
    environment:
      RESTIC_FROM_PASSWORD_FILE: /run/secrets/restic_password
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
    secrets:
      - google_service_account
      - restic_password
    volumes:
      - ./resticprofile:/resticprofile:ro
      - /apps:/apps:ro
      - /apps/resticprofile/cache:/var/cache/restic
    restart: unless-stopped

  kopia:
    image: kopia/kopia:0.19
    entrypoint: [/bin/sh, /app/entrypoint.sh]
    environment:
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
    secrets:
      - google_service_account
      - kopia_password
    volumes:
      - ./kopia/entrypoint.sh:/app/entrypoint.sh:ro
      - /apps:/apps:ro
      - /apps/kopia/cache:/app/cache
      - /apps/kopia/config:/app/config
      - /apps/kopia/logs:/app/logs
    ports:
      - "51515:51515"
    restart: unless-stopped

secrets:
  google_service_account:
    environment: GOOGLE_SERVICE_ACCOUNT_JSON
  restic_password:
    environment: RESTIC_PASSWORD
  kopia_password:
    environment: KOPIA_PASSWORD
