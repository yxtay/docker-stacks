services:
  resticprofile:
    # nosemgrep
    image: creativeprojects/resticprofile:0.34.0@sha256:e17dbdfa280c0031ba54399805675b9795cea78a33e202925a3f1850da2acfc1
    entrypoint: [sh]
    command: >-
      -c "resticprofile schedule --all && exec crond -f -L /dev/stdout"
    environment:
      TZ: ${TZ:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_FROM_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTICPROFILE_LOCK_WAIT: 1h
      RCLONE_CONFIG: /config/rclone/rclone.conf
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    uts: host
    volumes:
      - ./config:/resticprofile:ro
      - /apps/rclone:/config/rclone
      - /apps:/apps:ro
      - /backups/restic:/backup
      - /apps/resticprofile/cache:/var/cache/restic
    healthcheck:
      test: [CMD, resticprofile, snapshots]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    profiles:
      - rsync
    tty: false
    command:
      - rsync
      - --archive
      - --hard-links
      - --acls
      - --xattrs
      - --numeric-ids
      - --sparse
      - --partial
      - --one-file-system
      - --delete-after
      - --delete-excluded
      - --exclude-from=/config/exclude.txt
      - /apps/
      - /data/apps/
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./config:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    restart: no
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  rclone:
    image: ghcr.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    profiles:
      - rclone
    tty: false
    command:
      - sync
      - --track-renames
      - --one-file-system
      - --ignore-case
      - --delete-excluded
      - --exclude-from
      - /config/exclude.txt
      - --exclude-if-present
      - .nobackup
      - --exclude-if-present
      - CACHEDIR.TAG
      - /apps/
      - /data/apps/
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./config:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    tmpfs:
      - /root
    restart: no
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
