services:
  resticprofile:
    # nosemgrep
    image: creativeprojects/resticprofile:0.33.1@sha256:e083988d54dcc894ed04216b23ac54ccbb95f49cbe494210def7ac536b0a4f18
    entrypoint: [sh]
    command: >-
      -c "resticprofile schedule --all && exec crond -f -L /dev/stdout"
    environment:
      TZ: ${TZ:-Etc/UTC}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTIC_FROM_PASSWORD: ${RESTIC_PASSWORD:?}
      RESTICPROFILE_LOCK_WAIT: 1h
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:?}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:?}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    uts: host
    volumes:
      - ./config:/resticprofile:ro
      - /apps/rclone:/config/rclone
      - /apps:/apps:ro
      - /backups/restic:/backup
      - /apps/resticprofile/cache:/var/cache/restic
    healthcheck:
      test: [CMD, resticprofile, snapshots]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    profiles:
      - sync
    tty: false
    command:
      - rsync
      - --archive
      - --hard-links
      - --acls
      - --xattrs
      - --one-file-system
      - --delete-after
      - --numeric-ids
      - --partial
      - --sparse
      - --exclude-from=/config/exclude.txt
      - /apps/
      - /data/apps/
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./config:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    restart: no
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  rclone:
    image: ghcr.io/rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    profiles:
      - sync
    tty: false
    command:
      - sync
      - /apps/
      - /data/apps/
      - --exclude-from
      - /config/exclude.txt
      - --exclude-if-present
      - .nobackup
      - --exclude-if-present
      - CACHEDIR.TAG
      - --ignore-case
      - --one-file-system
      - --skip-links
      - --track-renames
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./config:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    tmpfs:
      - /root
    restart: no
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
