services:
  resticprofile:
    # nosemgrep
    image: creativeprojects/resticprofile:0.33.1@sha256:2dd6820c345794cd8ea6b736e02070e85940c67de3a9f5002f57c47052080616
    entrypoint: [sh]
    command: >-
      -c "resticprofile schedule --all && crond -f -L /dev/stdout"
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:?}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:?}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_FOLDER_ID:?}
    secrets:
      - restic_password
    volumes:
      - ./resticprofile:/resticprofile:ro
      - /apps/rclone:/config/rclone
      - /apps:/apps:ro
      - /backups/restic:/backup
      - /apps/resticprofile/cache:/var/cache/restic
    uts: host
    healthcheck:
      test: [CMD, resticprofile, --dry-run, backup]
    restart: unless-stopped

  rclone-sync:
    image: ghcr.io/rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    command:
      - sync
      - /apps/
      - /data/apps/
      - --filter-from
      - /config/filter.txt
      - --exclude-if-present
      - .nobackup
      - --exclude-if-present
      - .git
      - --exclude-if-present
      - .github
      - --exclude-if-present
      - .gitignore
      - --exclude-if-present
      - CACHEDIR.TAG
      - --ignore-case
      - --checksum
      - --one-file-system
      - --skip-links
      - --track-renames
    volumes:
      - ./rclone:/config
      - /apps:/apps:ro
      - /data/apps:/data/apps
    restart: no
    profiles:
      - sync

networks:
  default:
    name: caddy
    external: true

secrets:
  restic_password:
    environment: RESTIC_PASSWORD
