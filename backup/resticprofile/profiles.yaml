version: "2"

profiles:
  apps:
    repository: rclone:gdrive:backups/apps
    initialize: true
    cache-dir: /var/cache/restic
    cleanup-cache: true

    backup:
      source:
        - /apps
      schedule: daily
      check-after: true
      one-file-system: true
      no-error-on-warning: true
      exclude-caches: true
      exclude-if-present:
        - .git
        - .nobackup
      iexclude:
        - "*.bak"
        # Temp and runtime files
        - "*.tmp"
        - "*.pid"
        - "*.lock"
        - tmp
        - temp
        - cache
        # Database temp files
        - "*-wal"
        - "*-shm"
        # Build artifacts
        - __pycache__
        - "*.pyc"
        # App-generated regenerable data
        - MediaCover
        # App-specific paths
        - profilarr/data/databases
        - prowlarr/Definitions

    retention:
      keep-daily: 7
      keep-weekly: 4
      keep-monthly: 3
      prune: true
