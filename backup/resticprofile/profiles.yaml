version: "2"

global:
  default-command: snapshots

profiles:
  default:
    repository: rclone:gdrive:backups/apps
    password-file: /run/secrets/restic_password
    cache-dir: /var/cache/restic
    initialize: true

    backup:
      source:
        - /apps
      schedule: daily
      iexclude:
        - __pycache__
        - "*.pyc"
        - cache
        - MediaCover
        - profilarr/data/databases
        - prowlarr/Definitions
      exclude-caches: true
      exclude-if-present:
        - .git
        - .nobackup
      no-error-on-warning: true
      one-file-system: true

    retention:
      after-backup: true
      keep-daily: 7
      keep-weekly: 4
      keep-monthly: 3
      prune: true

    check:
      schedule: weekly

    snapshots:
      group-by: host,paths
