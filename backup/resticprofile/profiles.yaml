version: "2"

# {{ $local_repo := "local:/backup" }}
# {{ $remote_repo := "rclone:gdrive:" }}
# {{ $password_file := "/run/secrets/restic_password" }}

global:
  scheduler: crond

profiles:
  base:
    # password-file: "{{ $password_file }}"
    initialize: true
    cache-dir: /var/cache/restic
    cleanup-cache: true

    backup:
      send-after-fail: &send-after-fail
        method: POST
        url: "https://ntfy.sh/{{ .Env.NTFY_TOPIC_PREFIX }}-resticprofile"
        headers:
          - name: Title
            value: "resticprofile failed"
          - name: Priority
            value: high
        body: |
          host: {{ .Hostname }}
          message: ${ERROR}
          command: ${ERROR_COMMANDLINE}
          stderr: ${ERROR_STDERR}
      host: true
      source:
        - /apps
      check-after: true
      one-file-system: true
      no-error-on-warning: true
      exclude-caches: true
      exclude-if-present:
        - .git
        - .github
        - .gitignore
        - .nobackup
      iexclude:
        # Temp and runtime files
        - "*.bak"
        - "*.pid"
        - "*.lock"
        - "*.tmp"
        - "*-cache"
        - .cache
        - cache
        - logs
        - tmp
        # Build artifacts
        - __pycache__
        - "*.pyc"
        # App-specific paths
        - MediaCover
        - altmount/.nzbs
        - altmount/metadata
        - esphome/.esphome
        - homeassistant/deps
        - homeassistant/tts
        - immich/data/encoded-video
        - immich/data/library
        - immich/data/thumbs
        - immich/data/upload
        - immich/database
        - nzbdav/blobs
        - portainer/compose
        - profilarr/data/databases
        - prowlarr/Definitions

    forget: &forget
      send-after-fail: *send-after-fail
      host: true
      path: true
      keep-daily: 7
      keep-weekly: 4
      keep-monthly: 3
      prune: true

    check:
      send-after-fail: *send-after-fail
      read-data-subset: "100M"

    copy:
      send-after-fail: *send-after-fail
      host: true
      path: true

    snapshots:
      host: true
      path: true

    stats:
      host: true
      path: true

  default:
    inherit: base
    repository: "{{ $local_repo }}"

    backup:
      schedule: "00:00"

    retention: *forget

    copy:
      repository: "{{ $remote_repo }}"
      # password-file: "{{ $password_file }}"

  remote:
    inherit: base
    repository: "{{ $remote_repo }}"

    copy:
      schedule: Sun 02:00
      from-repository: "{{ $local_repo }}"
      # from-password-file: "{{ $password_file }}"

    forget:
      schedule: Sun 03:00

    check:
      schedule: Sun 04:00
