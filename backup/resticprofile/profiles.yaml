version: "2"

global:
  scheduler: crond

profiles:
  base:
    password-file: /run/secrets/restic_password
    initialize: true
    cache-dir: /var/cache/restic
    cleanup-cache: true

    backup:
      host: true
      source:
        - /apps
      check-after: true
      one-file-system: true
      no-error-on-warning: true
      exclude-caches: true
      exclude-if-present:
        - .git
        - .github
        - .gitignore
        - .nobackup
      iexclude:
        # Temp and runtime files
        - "*.pid"
        - "*.lock"
        - .cache
        - cache
        # Build artifacts
        - __pycache__
        - "*.pyc"
        # App-specific paths
        - MediaCover
        - altmount/.nzbs
        - altmount/metadata
        - nzbdav/blobs
        - profilarr/data/databases
        - prowlarr/Definitions

    forget: &forget
      host: true
      path: true
      keep-daily: 7
      keep-weekly: 4
      keep-monthly: 3
      prune: true

  default:
    inherit: base
    repository: "local:/backup"

    backup:
      schedule: "00:00"

    retention: *forget

    copy:
      repository: "rclone:gdrive:"
      password-file: /run/secrets/restic_password

  remote:
    inherit: base
    repository: "rclone:gdrive:"

    copy:
      schedule: Sun 02:00
      from-repository: "local:/backups/restic"
      from-password-file: /run/secrets/restic_password

    forget:
      schedule: Sun 03:00

    check:
      schedule: Sun 04:00
