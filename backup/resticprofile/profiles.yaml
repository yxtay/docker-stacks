global:
  scheduler: crond

base:
  password-file: /run/secrets/restic_password
  initialize: true
  cache-dir: /var/cache/restic
  cleanup-cache: true

default:
  inherit: base
  repository: local:/backups/restic

  backup:
    schedule: "00:00"
    source:
      - /apps
    check-after: true
    one-file-system: true
    no-error-on-warning: true
    exclude-caches: true
    exclude-if-present:
      - .git
      - .github
      - .gitignore
      - .nobackup
    iexclude:
      # Temp and runtime files
      - "*.pid"
      - "*.lock"
      - .cache
      - cache
      # Build artifacts
      - __pycache__
      - "*.pyc"
      # App-specific paths
      - MediaCover
      - altmount/.nzbs
      - altmount/metadata
      - nzbdav/blobs
      - profilarr/data/databases
      - prowlarr/Definitions

  forget:
    schedule: "02:00"
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 3
    prune: true

  copy:
    schedule: Sun 03:00
    repository: "rclone:gdrive:"
    password-file: /run/secrets/restic_password
    initialize: true

remote:
  inherit: base
  repository: "rclone:gdrive:"

  forget:
    schedule: Sun 04:00
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 3
    prune: true

  check:
    schedule: Sun 05:00
