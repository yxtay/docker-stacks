services:
  cli-mount:
    # nosemgrep
    image: ghcr.io/mash2k3/cli_mount:dev
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/cli-mount:/app
      - /mnt/remote/cli_mount:/mnt/remote/cli_mount:rshared
    expose:
      - 8282
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth cli-mount cli-mount:8282
      pangolin.public-resources.cli-mount.name: cli-mount
      pangolin.public-resources.cli-mount.mode: http
      pangolin.public-resources.cli-mount.full-domain: "cli-mount.${DOMAIN:?}"
      pangolin.public-resources.cli-mount.auth.sso-enabled: true
      pangolin.public-resources.cli-mount.targets[0].hostname: cli-mount
      pangolin.public-resources.cli-mount.targets[0].port: 8282
      pangolin.public-resources.cli-mount.targets[0].method: http

  cli-debrid:
    # nosemgrep
    image: godver3/cli_debrid:dev-0.7.87
    depends_on:
      cli-mount:
        condition: service_healthy
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/cli-debrid:/user
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 5000
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5000/auth/login")
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth cli-debrid cli-debrid:5000
      pangolin.public-resources.cli-debrid.name: cli-debrid
      pangolin.public-resources.cli-debrid.mode: http
      pangolin.public-resources.cli-debrid.full-domain: "cli-debrid.${DOMAIN:?}"
      pangolin.public-resources.cli-debrid.auth.sso-enabled: true
      pangolin.public-resources.cli-debrid.targets[0].hostname: cli-debrid
      pangolin.public-resources.cli-debrid.targets[0].port: 5000
      pangolin.public-resources.cli-debrid.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
