services:
  duckdns:
    # nosemgrep
    image: lscr.io/linuxserver/duckdns:version-d67e71cc@sha256:424dbc5a5db5388ad4c197882eac475c5bfad2be1e02a761692946d406591b17
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?}
      - TOKEN=${DUCKDNS_TOKEN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/duckdns:/config
    tmpfs:
      - /run:exec
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: caddy
    external: true
