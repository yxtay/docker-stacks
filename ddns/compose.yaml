services:
  duckdns:
    # nosemgrep
    image: lscr.io/linuxserver/duckdns:version-d67e71cc@sha256:424dbc5a5db5388ad4c197882eac475c5bfad2be1e02a761692946d406591b17
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?}
      - FILE__TOKEN=/run/secrets/duckdns_token
    secrets:
      - duckdns_token
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/duckdns:/config
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped

networks:
  default:
    name: caddy
    external: true

secrets:
  duckdns_token:
    environment: DUCKDNS_TOKEN
