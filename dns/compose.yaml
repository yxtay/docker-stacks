services:
  adguard:
    image: adguard/adguardhome:v0.107.78@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    cap_add:
      # - NET_ADMIN # dhcp
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/adguard/conf:/opt/adguardhome/conf
      - /apps/adguard/work:/opt/adguardhome/work
    ports:
      # dns
      - target: 53
        published: 53
        protocol: tcp
        mode: host # for client ip addresses to show up correctly
      - target: 53
        published: 53
        protocol: udp
        mode: host # for client ip addresses to show up correctly
        # dns over https
        # - target: 443
        #   published: 443
        #   protocol: tcp
        #   mode: host
        # dns over tls
        # - target: 853
        #   published: 853
        #   protocol: tcp
        #   mode: host
        # dns over quic
        # - target: 853
        #   published: 853
        #   protocol: udp
        #   mode: host
        # dnscrypt
        # - target: 5443
        #   published: 5443
        #   protocol: tcp
        #   mode: host
        # - target: 5443
        #   published: 5443
        #   protocol: udp
        #   mode: host
        # dhcp
        # - 67:67/udp
        # - 68:68/tcp
        # - 68:68/udp
    expose:
      - 3000/tcp
    healthcheck:
      test: [CMD, nslookup, localhost, 127.0.0.1]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth adguard adguard:3000
      caddy.@adguard_doh.host: "adguard.{env.DOMAIN}"
      caddy.@adguard_doh.path: /dns-query /dns-query/*
      caddy.handle: "@adguard_doh"
      caddy.handle.reverse_proxy: "adguard:443"
      caddy.handle.reverse_proxy.transport: http
      caddy.handle.reverse_proxy.transport.tls_server_name: "{host}"

networks:
  default:
    name: proxy
    external: true
