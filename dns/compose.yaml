services:
  adguard:
    image: adguard/adguardhome:v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
    # cap_add:
    #   - NET_ADMIN # dhcp
    volumes:
      - /apps/adguard/conf:/opt/adguardhome/conf
      - /apps/adguard/work:/opt/adguardhome/work
    ports:
      # dns
      - target: 53
        published: 53
        protocol: tcp
        mode: host # for client ip addresses to show up correctly
      - target: 53
        published: 53
        protocol: udp
        mode: host # for client ip addresses to show up correctly
        # dns over https
        # - target: 443
        #   published: 443
        #   protocol: tcp
        #   mode: host
        # dns over tls
        # - target: 853
        #   published: 853
        #   protocol: tcp
        #   mode: host
        # dns over quic
        # - target: 853
        #   published: 853
        #   protocol: udp
        #   mode: host
        # dnscrypt
        # - target: 5443
        #   published: 5443
        #   protocol: tcp
        #   mode: host
        # - target: 5443
        #   published: 5443
        #   protocol: udp
        #   mode: host
        # dhcp
        # - 67:67/udp
        # - 68:68/tcp
        # - 68:68/udp
    expose:
      - 3000/tcp
    healthcheck:
      test: [CMD, nslookup, localhost, 127.0.0.1]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy adguard adguard:3000
      caddy.@adguard_doh.host: "adguard.{env.DOMAIN}"
      caddy.@adguard_doh.path: /dns-query /dns-query/*
      caddy.handle: "@adguard_doh"
      caddy.handle.reverse_proxy: "adguard:443"
      caddy.handle.reverse_proxy.transport: http
      caddy.handle.reverse_proxy.transport.tls_server_name: "{host}"

networks:
  default:
    name: caddy
    external: true
