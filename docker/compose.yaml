services:
  autoheal:
    # nosemgrep
    image: willfarrell/autoheal:latest@sha256:ad53db0ffdb59c97d1e0035352af270511305b5f58e17e05aab6e592a6927456
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      DOCKER_SOCK: tcp://socket_proxy:2375
      WEBHOOK_URL: https://ntfy.sh/${NTFY_TOPIC_PREFIX:?}-autoheal
    networks:
      - socket_proxy
    restart: unless-stopped

  dozzle:
    # nosemgrep
    image: ghcr.io/amir20/dozzle:v10.6.5@sha256:fa12525776bf665147d82bf031ff262ee89a0a12454122558a353ec38ada4aaf
    environment:
      DOCKER_HOST: tcp://socket_proxy:2375
      DOZZLE_ENABLE_ACTIONS: true
      DOZZLE_AUTH_PROVIDER: forward-proxy
    volumes:
      - /apps/dozzle:/data
    expose:
      - 8080
    networks:
      - default
      - socket_proxy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dozzle dozzle:8080

  beszel:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel:0.18.7@sha256:5b583633750cae65a9c1ab399c4c0eed229666ad74e103801724e3bc465338b8
    volumes:
      - /apps/beszel/hub:/beszel_data
    ports:
      - 127.0.0.1:8090:8090
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth beszel beszel:8090

  beszel_agent:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel-agent:latest@sha256:df297c2fd53958c0dd15261c5a12501a70e42c630772603b0eaa5027cb32cbb4
    environment:
      HUB_URL: http://localhost:8090
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
    volumes:
      - /apps/beszel/agent:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    network_mode: host
    healthcheck:
      test: [CMD, /agent, health]
    restart: unless-stopped

networks:
  default:
    name: public_default
    external: true
  socket_proxy:
    name: socket_proxy
    external: true
