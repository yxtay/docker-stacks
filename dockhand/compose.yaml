services:
  dockhand:
    # nosemgrep
    image: fnsys/dockhand:v1.0.34@sha256:6460c53982b825d6ffe298b53c5e985143ef0480ce58e8bb5999660f79302557
    environment:
      DATA_DIR: ${DOCKHAND_DATA:?}
    ports:
      - 3000:3000
    volumes:
      - ../:/home/dockhand/
      - ${DOCKHAND_DATA}:${DOCKHAND_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # network_mode: host  # required for initial setup
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dockhand dockhand:3000

networks:
  default:
    name: caddy
    external: true
