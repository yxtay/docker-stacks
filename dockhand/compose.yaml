services:
  dockhand:
    # nosemgrep
    image: fnsys/dockhand:v1.0.37@sha256:1927b2b33966a83964a876d010818157b84af05fc3736f1c0c600d7291f2c2b1
    environment:
      DATA_DIR: ${DOCKHAND_DATA:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ../:/home/dockhand/
      - ${DOCKHAND_DATA}:${DOCKHAND_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3000:3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dockhand dockhand:3000

networks:
  default:
    name: proxy
    external: true
