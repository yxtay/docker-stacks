services:
  dockhand:
    # nosemgrep
    image: fnsys/dockhand:v1.0.35@sha256:1b9473bd11cb60fed23bad8d335acb03f032b369230cd0a3dc3c0a1cbb8cb47c
    environment:
      DATA_DIR: ${DOCKHAND_DATA:?}
    ports:
      - 3000:3000
    volumes:
      - ../:/home/dockhand/
      - ${DOCKHAND_DATA}:${DOCKHAND_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # network_mode: host  # required for initial setup
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dockhand dockhand:3000

networks:
  default:
    name: caddy
    external: true
