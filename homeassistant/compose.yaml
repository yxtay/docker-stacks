services:
  homeassistant:
    # nosemgrep
    image: lscr.io/linuxserver/homeassistant:2026.9.4@sha256:a19464587d5d59ea13d90b3eb8f60e9eace2a932b0e28e8c2fe3bbf3d6095b8f
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8123"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy homeassistant ${IP_ADDRESS:-host.docker.internal}:8123
      pangolin.public-resources.homeassistant.name: homeassistant
      pangolin.public-resources.homeassistant.mode: http
      pangolin.public-resources.homeassistant.full-domain: "homeassistant.${DOMAIN:?}"
      pangolin.public-resources.homeassistant.auth.sso-enabled: true
      pangolin.public-resources.homeassistant.targets[0].hostname: ${IP_ADDRESS:-host.docker.internal}
      pangolin.public-resources.homeassistant.targets[0].port: 8123
      pangolin.public-resources.homeassistant.targets[0].method: http

  music-assistant:
    # nosemgrep
    image: ghcr.io/music-assistant/server:2.10.5@sha256:28023f8c0d96ca2496391f3218a6d70d7ef3ba84db846b3a3f3cd9ce7ef8aedc
    # Additional caps needed to mount smb folders within the container:
    # cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    # security_opt: [apparmor:unconfined]
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/music-assistant:/data
    tmpfs:
      - /tmp
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8095"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 3
          memory: 12g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy music-assistant ${IP_ADDRESS:-host.docker.internal}:8095
      pangolin.public-resources.music-assistant.name: music-assistant
      pangolin.public-resources.music-assistant.mode: http
      pangolin.public-resources.music-assistant.full-domain: "music-assistant.${DOMAIN:?}"
      pangolin.public-resources.music-assistant.auth.sso-enabled: true
      pangolin.public-resources.music-assistant.targets[0].hostname: ${IP_ADDRESS:-host.docker.internal}
      pangolin.public-resources.music-assistant.targets[0].port: 8095
      pangolin.public-resources.music-assistant.targets[0].method: http

  esphome:
    # nosemgrep
    image: ghcr.io/esphome/esphome:2026.9.1@sha256:776a845d508909bf426d2ee7bdd81796361ebe6a7f091807ce1d6d0b48985413
    environment:
      PLATFORMIO_CORE_DIR: /config/.esphome/platformio
      UV_CACHE_DIR: /config/.esphome/platformio/.cache/uv
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/esphome:/config
    tmpfs:
      - /root
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6052/version"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy esphome ${IP_ADDRESS:-host.docker.internal}:6052
      pangolin.public-resources.esphome.name: esphome
      pangolin.public-resources.esphome.mode: http
      pangolin.public-resources.esphome.full-domain: "esphome.${DOMAIN:?}"
      pangolin.public-resources.esphome.auth.sso-enabled: true
      pangolin.public-resources.esphome.targets[0].hostname: ${IP_ADDRESS:-host.docker.internal}
      pangolin.public-resources.esphome.targets[0].port: 6052
      pangolin.public-resources.esphome.targets[0].method: http

  trmnlha:
    # nosemgrep
    image: ghcr.io/usetrmnl/trmnl-ha-amd64:0.11.0@sha256:c7b4027372264eb5faee88eac45ce257218f6dd146f1337dc66c25fd6b775b28
    environment:
      HOME_ASSISTANT_URL: "http://${IP_ADDRESS:-host.docker.internal}:8123"
      ACCESS_TOKEN: ${HOME_ASSISTANT_TOKEN}
      KEEP_BROWSER_OPEN: "true"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/trmnlha:/data
    tmpfs:
      - /root
      - /tmp
    ports:
      - 10000:10000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:10000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy trmnlha trmnlha:10000
      pangolin.public-resources.trmnlha.name: trmnlha
      pangolin.public-resources.trmnlha.mode: http
      pangolin.public-resources.trmnlha.full-domain: "trmnlha.${DOMAIN:?}"
      pangolin.public-resources.trmnlha.auth.sso-enabled: true
      pangolin.public-resources.trmnlha.targets[0].hostname: trmnlha
      pangolin.public-resources.trmnlha.targets[0].port: 10000
      pangolin.public-resources.trmnlha.targets[0].method: http

  tesserae:
    # nosemgrep
    image: ghcr.io/dmellok/tesserae:0.436.1@sha256:d889a0d1098d03686624802b8819f85dabce9def7ef47b4c06fef02fdb162a47
    environment:
      TZ: ${TZ:-UTC}
      TESSERAE_IN_DOCKER: 1
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/tesserae:/app/data
    tmpfs:
      - /tmp
    # Host network needed for MQTT broker (1883) and mDNS
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8765/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy tesserae ${IP_ADDRESS:-host.docker.internal}:8765
      pangolin.public-resources.tesserae.name: tesserae
      pangolin.public-resources.tesserae.mode: http
      pangolin.public-resources.tesserae.full-domain: "tesserae.${DOMAIN:?}"
      pangolin.public-resources.tesserae.auth.sso-enabled: true
      pangolin.public-resources.tesserae.targets[0].hostname: ${IP_ADDRESS:-host.docker.internal}
      pangolin.public-resources.tesserae.targets[0].port: 8765
      pangolin.public-resources.tesserae.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
