services:
  homeassistant:
    # nosemgrep
    image: ghcr.io/home-assistant/home-assistant:2026.6.2
    healthcheck:
      test: [CMD, curl, -fSs, 'http://localhost:8123']
    environment:
      TZ: ${TZ:-UTC}
    # privileged: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy homeassistant ${IP_ADDRESS}:8123

  music_assistant:
    # nosemgrep
    image: ghcr.io/music-assistant/server:2.9.0
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    # privileged caps (and security-opt) needed to mount smb folders within the container
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - /apps/music_assistant:/data
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy music_assistant ${IP_ADDRESS}:8095

  esphome:
    # nosemgrep
    image: ghcr.io/esphome/esphome:2026.5.3
    healthcheck:
      test: [CMD, curl, -fSs, 'http://localhost:6052']
    environment:
      TZ: ${TZ:-UTC}
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/esphome:/config
    network_mode: host
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy esphome ${IP_ADDRESS}:6052

  trmnl_ha:
    # nosemgrep
    image: ghcr.io/usetrmnl/trmnl-ha-amd64:v0.8.1
    healthcheck:
      test: [CMD, curl, -fSs, "http://localhost:10000/health"]
    environment:
      HOME_ASSISTANT_URL: http://${IP_ADDRESS}:8123
      ACCESS_TOKEN: ${HOME_ASSISTANT_TOKEN}
      KEEP_BROWSER_OPEN: "true"
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/trmnl-ha:/data
    ports:
      - 10000:10000
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy trmnl_ha trmnl_ha:10000

networks:
  default:
    name: caddy
    external: true
