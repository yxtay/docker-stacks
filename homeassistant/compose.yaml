services:
  homeassistant:
    # nosemgrep
    image: lscr.io/linuxserver/homeassistant:2026.6.4@sha256:21b85b512822424236cda5132abf869a1093d07d00122df3a2f66b6bbdf37adf
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8123"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy homeassistant ${IP_ADDRESS:-host.docker.internal}:8123

  music_assistant:
    # nosemgrep
    image: ghcr.io/music-assistant/server:2.9.4@sha256:e5dbb44e9dc92ff95dd2b15a9176b238f4e0969aed89850bf428b3d424640ca3
    # Additional caps needed to mount smb folders within the container:
    # cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    # security_opt: [apparmor:unconfined]
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/music_assistant:/data
    tmpfs:
      - /tmp
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8095"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 3
          memory: 12g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy music_assistant ${IP_ADDRESS:-host.docker.internal}:8095

  esphome:
    # nosemgrep
    image: ghcr.io/esphome/esphome:2026.6.3@sha256:6cba3ffe30cf858f0609b5028d9143dd821242c1ebbf2429a79e9c90cf52c130
    environment:
      TZ: ${TZ:-UTC}
      PLATFORMIO_CORE_DIR: /config/.esphome/platformio
      UV_CACHE_DIR: /config/.esphome/platformio/.cache/uv
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/esphome:/config
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6052/version"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy esphome ${IP_ADDRESS:-host.docker.internal}:6052

  trmnl_ha:
    # nosemgrep
    image: ghcr.io/usetrmnl/trmnl-ha-${ARCH:-amd64}:0.8.1
    environment:
      HOME_ASSISTANT_URL: "http://${IP_ADDRESS:-host.docker.internal}:8123"
      ACCESS_TOKEN: ${HOME_ASSISTANT_TOKEN}
      KEEP_BROWSER_OPEN: "true"
      TZ: ${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/trmnl-ha:/data
    tmpfs:
      - /root
      - /tmp
    ports:
      - 10000:10000
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:10000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy trmnl_ha trmnl_ha:10000

networks:
  default:
    name: proxy
    external: true
