services:
  homeassistant:
    # nosemgrep
    image: lscr.io/linuxserver/homeassistant:2026.6.4@sha256:27b5661081d676755bf2851aca9ad9a78ca0bb1fafcb138280524b28e8d06ffd
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8123"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy homeassistant ${HA_IP_ADDRESS:?}:8123

  music_assistant:
    # nosemgrep
    image: ghcr.io/music-assistant/server:2.9.3@sha256:fa04f9187e65362d489034d5b4072e94a7bef741c29c47e2b9a36325730605f2
    # Additional caps needed to mount smb folders within the container:
    # cap_add: [SYS_ADMIN, DAC_READ_SEARCH]
    # security_opt: [apparmor:unconfined]
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/music_assistant:/data
    tmpfs:
      - /tmp
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8095"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy music_assistant ${HA_IP_ADDRESS:?}:8095

  esphome:
    # nosemgrep
    image: ghcr.io/esphome/esphome:2026.6.2@sha256:526a75c8d64a0d962a3b088c3af4fa7cf8ecf7161b995be57fc95b0726496a39
    environment:
      TZ: ${TZ:-UTC}
      PLATFORMIO_CORE_DIR: /config/.esphome/platformio
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - /apps/esphome:/config
    # tmpfs:
    #   - /.cache
    network_mode: host
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6052/version"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy esphome ${HA_IP_ADDRESS:?}:6052

  trmnl_ha:
    # nosemgrep
    image: ghcr.io/usetrmnl/trmnl-ha-${ARCH:-amd64}:0.8.1
    environment:
      HOME_ASSISTANT_URL: "http://${HA_IP_ADDRESS:?}:8123"
      ACCESS_TOKEN: ${HOME_ASSISTANT_TOKEN}
      KEEP_BROWSER_OPEN: "true"
      TZ: ${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/trmnl-ha:/data
    tmpfs:
      - /root
      - /tmp
    ports:
      - 10000:10000
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:10000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy trmnl_ha trmnl_ha:10000

networks:
  default:
    name: caddy
    external: true
