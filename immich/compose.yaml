services:
  immich_server:
    # nosemgrep
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${DATA_LOCATION:?}:/data
      - ${LIBRARY_LOCATION:?}:/data/library
    expose:
      - 2283
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/2283"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich immich_server:2283

  immich_machine_learning:
    # nosemgrep
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    working_dir: /root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich/model/cache:/cache
    tmpfs:
      - /root
    expose:
      - 3003
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/3003"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512

  redis:
    # nosemgrep
    image: ghcr.io/valkey-io/valkey:9.1.0@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, valkey-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  database:
    # nosemgrep
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3@sha256:f3028f313a766e48fed94f077fb19a8718c5cc673cb00d51a038fdce480d670a
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      PGUSER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      PGDATABASE: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    shm_size: 128mb
    volumes:
      - ${DB_DATA_LOCATION:?}:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  gphotos2immich:
    # nosemgrep
    image: ghcr.io/warreth/gphotos2immich:v1.6.2@sha256:b6e2e308c033c9eabd2bb1775cd3b405da164be002325087d199109ee652b738
    depends_on:
      immich_server:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/gphotos2immich/config.json:/app/config.json
      - /apps/gphotos2immich/data:/app/data
    expose:
      - 8080
    networks:
      - proxy
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy gphotos2immich gphotos2immich:8080

  immich_kiosk:
    # nosemgrep
    image: ghcr.io/damongolding/immich-kiosk:0.39.3@sha256:b65371b9fbe93cde8355c06ba095fb4801bbb5d7c8c51065a5bfa02183536771
    depends_on:
      immich_server:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich_kiosk:/config
    tmpfs:
      - /tmp
    expose:
      - 3000
    networks:
      - proxy
    healthcheck:
      test: [CMD, /kiosk, --healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich_kiosk immich_kiosk:3000

networks:
  default:
  proxy:
    external: true
