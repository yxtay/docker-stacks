services:
  immich-server:
    # nosemgrep
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:?}
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${DATA_LOCATION:?}:/data
      - ${LIBRARY_LOCATION:?}:/data/library
    expose:
      - 2283
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/2283"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich immich-server:2283
      pangolin.public-resources.immich.name: immich
      pangolin.public-resources.immich.mode: http
      pangolin.public-resources.immich.full-domain: "immich.${DOMAIN:?}"
      pangolin.public-resources.immich.auth.sso-enabled: true
      pangolin.public-resources.immich.targets[0].hostname: immich-server
      pangolin.public-resources.immich.targets[0].port: 2283
      pangolin.public-resources.immich.targets[0].method: http

  immich-machine-learning:
    # nosemgrep
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    working_dir: /root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich/model/cache:/cache
    tmpfs:
      - /root
    expose:
      - 3003
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/3003"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512

  redis:
    # nosemgrep
    image: ghcr.io/valkey-io/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, valkey-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  database:
    # nosemgrep
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      PGUSER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME:?}
      PGDATABASE: ${DB_DATABASE_NAME}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${DB_DATA_LOCATION:?}:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  gphotos2immich:
    # nosemgrep
    image: ghcr.io/warreth/gphotos2immich:v1.12.0@sha256:d699105347236e8e644a0177c0ab88bd8c9111e5b72db3210a96c3f238917b32
    depends_on:
      immich-server:
        condition: service_healthy
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/gphotos2immich/config.json:/app/config.json
      - /apps/gphotos2immich/data:/app/data
    expose:
      - 8080
    networks:
      - proxy
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/api/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy gphotos2immich gphotos2immich:8080
      pangolin.public-resources.gphotos2immich.name: gphotos2immich
      pangolin.public-resources.gphotos2immich.mode: http
      pangolin.public-resources.gphotos2immich.full-domain: "gphotos2immich.${DOMAIN:?}"
      pangolin.public-resources.gphotos2immich.auth.sso-enabled: true
      pangolin.public-resources.gphotos2immich.targets[0].hostname: gphotos2immich
      pangolin.public-resources.gphotos2immich.targets[0].port: 8080
      pangolin.public-resources.gphotos2immich.targets[0].method: http

  immich-kiosk:
    # nosemgrep
    image: ghcr.io/damongolding/immich-kiosk:0.54.0@sha256:138c691695b3c759f70d15a8baea6636b5f4e55ae8fbf5272de1e124a4a7ae65
    depends_on:
      immich-server:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich-kiosk:/config
    tmpfs:
      - /tmp
    ports:
      - 3000:3000
    networks:
      - proxy
    healthcheck:
      test: [CMD, /kiosk, --healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich-kiosk immich-kiosk:3000
      pangolin.public-resources.immich-kiosk.name: immich-kiosk
      pangolin.public-resources.immich-kiosk.mode: http
      pangolin.public-resources.immich-kiosk.full-domain: "immich-kiosk.${DOMAIN:?}"
      pangolin.public-resources.immich-kiosk.auth.sso-enabled: true
      pangolin.public-resources.immich-kiosk.targets[0].hostname: immich-kiosk
      pangolin.public-resources.immich-kiosk.targets[0].port: 3000
      pangolin.public-resources.immich-kiosk.targets[0].method: http

networks:
  default:
  proxy:
    external: true
