services:
  immich-server:
    # nosemgrep
    image: ghcr.io/immich-app/immich-server:v3.0.2@sha256:14390f3dc9512dc3273b12ccee6363d9be16c388699abc3f3fe0498bb9829937
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${DATA_LOCATION:?}:/data
      - ${LIBRARY_LOCATION:?}:/data/library
    expose:
      - 2283
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/2283"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich immich-server:2283
      pangolin.public-resources.immich.name: immich
      pangolin.public-resources.immich.mode: http
      pangolin.public-resources.immich.full-domain: "immich.${DOMAIN:?}"
      pangolin.public-resources.immich.auth.sso-enabled: true
      pangolin.public-resources.immich.targets[0].hostname: immich-server
      pangolin.public-resources.immich.targets[0].port: 2283
      pangolin.public-resources.immich.targets[0].method: http

  immich-machine-learning:
    # nosemgrep
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.2@sha256:412f68e46e1966d0f87a8733a430369ee184b3a83e7b1e2db536dff291a34aa7
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference
    working_dir: /root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich/model/cache:/cache
    tmpfs:
      - /root
    expose:
      - 3003
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/3003"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512

  redis:
    # nosemgrep
    image: ghcr.io/valkey-io/valkey:9.1.0@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, valkey-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  database:
    # nosemgrep
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      PGUSER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      PGDATABASE: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    shm_size: 128mb
    volumes:
      - ${DB_DATA_LOCATION:?}:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  gphotos2immich:
    # nosemgrep
    image: ghcr.io/warreth/gphotos2immich:v1.6.2@sha256:56a28e22ca0489428a7c8a2c1e708d1af808e9257d987057af720d8b6242c130
    depends_on:
      immich-server:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/gphotos2immich/config.json:/app/config.json
      - /apps/gphotos2immich/data:/app/data
    expose:
      - 8080
    networks:
      - proxy
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy gphotos2immich gphotos2immich:8080
      pangolin.public-resources.gphotos2immich.name: gphotos2immich
      pangolin.public-resources.gphotos2immich.mode: http
      pangolin.public-resources.gphotos2immich.full-domain: "gphotos2immich.${DOMAIN:?}"
      pangolin.public-resources.gphotos2immich.auth.sso-enabled: true
      pangolin.public-resources.gphotos2immich.targets[0].hostname: gphotos2immich
      pangolin.public-resources.gphotos2immich.targets[0].port: 8080
      pangolin.public-resources.gphotos2immich.targets[0].method: http

  immich-kiosk:
    # nosemgrep
    image: ghcr.io/damongolding/immich-kiosk:0.41.0@sha256:ee6145ac6bd5a5492a746d019bf01bbe25559def1cbc2e79f61b0871b8933cf6
    depends_on:
      immich-server:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/immich-kiosk:/config
    tmpfs:
      - /tmp
    expose:
      - 3000
    networks:
      - proxy
    healthcheck:
      test: [CMD, /kiosk, --healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy immich-kiosk immich-kiosk:3000
      pangolin.public-resources.immich-kiosk.name: immich-kiosk
      pangolin.public-resources.immich-kiosk.mode: http
      pangolin.public-resources.immich-kiosk.full-domain: "immich-kiosk.${DOMAIN:?}"
      pangolin.public-resources.immich-kiosk.auth.sso-enabled: true
      pangolin.public-resources.immich-kiosk.targets[0].hostname: immich-kiosk
      pangolin.public-resources.immich-kiosk.targets[0].port: 3000
      pangolin.public-resources.immich-kiosk.targets[0].method: http

networks:
  default:
  proxy:
    external: true
