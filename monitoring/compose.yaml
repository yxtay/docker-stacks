services:
  autoheal:
    # nosemgrep
    image: willfarrell/autoheal:latest@sha256:efd1369459c752c78574a705cdfcb7be130a980252a697c6e6b92f0d9346dbd2
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      DOCKER_SOCK: tcp://socket-proxy:2375
      WEBHOOK_URL: https://ntfy.sh/${NTFY_TOPIC_PREFIX:?}-autoheal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - socket-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:759e59ef04ba5efb668df6fe21f5c280e7a762b4b88b9a2736169e4b925e87a3
    command:
      - --file=/input/notifications.template.yml
      - --out=/output/notifications.yml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./dozzle:/input:ro
      - /apps/dozzle:/output
    environment:
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  dozzle:
    # nosemgrep
    image: ghcr.io/amir20/dozzle:v10.6.8@sha256:d282389858d23858cfe23882f9965d42145f370ac4abc021639efd95c3334336
    depends_on:
      gomplate:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_ENABLE_ACTIONS: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/dozzle:/data
    expose:
      - 8080
    networks:
      - default
      - socket-proxy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dozzle dozzle:8080

  beszel:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel:0.18.7@sha256:5b583633750cae65a9c1ab399c4c0eed229666ad74e103801724e3bc465338b8
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/beszel/hub:/beszel_data
    tmpfs:
      - /tmp
    ports:
      - 127.0.0.1:8090:8090
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth beszel beszel:8090

  beszel-agent:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel-agent:0.18.7@sha256:41252f7c7adf0b53ee1d72cbe2e3ea7adc7fffd357ff54bf2bd0c59d166e30c9
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      HUB_URL: ${HUB_URL:-http://localhost:8090}
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://localhost:2375}
    volumes:
      - /apps/beszel/agent:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    network_mode: host
    healthcheck:
      test: [CMD, /agent, health]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
  socket-proxy:
    name: socket-proxy
    external: true
