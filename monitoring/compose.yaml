services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:8658578ba8cdd5b257d240f9db9b45bf8879d5f0123ecc7c3f075fa17ff42e55
    command:
      - --file=/input/notifications.template.yml
      - --out=/output/notifications.yml
    environment:
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./dozzle:/input:ro
      - /apps/dozzle:/output
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  dozzle:
    # nosemgrep
    image: ghcr.io/amir20/dozzle:v11.1.1@sha256:c90494cbc3a9ca959634b89fdb3fdecbcbae1f690d7a567d0d356c6fda1d957c
    depends_on:
      gomplate:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_ENABLE_ACTIONS: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/dozzle:/data
    expose:
      - 8080
    networks:
      - default
      - socket-proxy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dozzle dozzle:8080

  beszel:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel:0.20.0@sha256:c44c2c25929505930c8bb850556c8e071dd00d42ea367d9b53243ef64bd57d17
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/beszel/hub:/beszel_data
    tmpfs:
      - /tmp
    ports:
      - 127.0.0.1:8090:8090
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth beszel beszel:8090

  beszel-agent:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel-agent:0.20.0@sha256:2c3b2d781a8bcdb464704c0024baab5486d238d40871b67c84d906d34791c490
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      HUB_URL: ${HUB_URL:-http://localhost:8090}
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://localhost:2375}
    volumes:
      - /apps/beszel/agent:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    network_mode: host
    healthcheck:
      test: [CMD, /agent, health]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
  socket-proxy:
    name: socket-proxy
    external: true
