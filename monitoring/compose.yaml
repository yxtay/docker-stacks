services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:a383ed5298b8de0134fe4c4f73481cebdf677b3120b63b129e963a2eb65f1de0
    command:
      - --file=/input/notifications.template.yml
      - --out=/output/notifications.yml
    environment:
      NTFY_TOPIC_PREFIX: ${NTFY_TOPIC_PREFIX:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./dozzle:/input:ro
      - /apps/dozzle:/output
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  dozzle:
    # nosemgrep
    image: ghcr.io/amir20/dozzle:v11.3.5@sha256:dd09e6aaa9d5ad686b6017427a502c40dc862ba28445609813e5ea1f66f6dbdf
    depends_on:
      gomplate:
        condition: service_completed_successfully
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOZZLE_ENABLE_ACTIONS: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/dozzle:/data
    expose:
      - 8080
    networks:
      - default
      - socket-proxy
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth dozzle dozzle:8080

  beszel:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/beszel/hub:/beszel_data
    tmpfs:
      - /tmp
    ports:
      - 127.0.0.1:8090:8090
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth beszel beszel:8090

  beszel-agent:
    # nosemgrep
    image: ghcr.io/henrygd/beszel/beszel-agent:0.21.1@sha256:cb6868012964d7a68debaa2c84bb72285e5f08531e81f506bd4c493bf052e41c
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      HUB_URL: ${HUB_URL:-http://localhost:8090}
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://localhost:2375}
    volumes:
      - /apps/beszel/agent:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    network_mode: host
    healthcheck:
      test: [CMD, /agent, health]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
  socket-proxy:
    name: socket-proxy
    external: true
