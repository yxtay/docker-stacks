services:
  netalertx:
    # nosemgrep
    image: ghcr.io/netalertx/netalertx:26.9.0@sha256:0ee5cdcaa8a84bfd2f31354b4b30e603804d124821055b9942dcffb52d2ce4bc
    environment:
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0}
      PORT: ${PORT:-20211}
      GRAPHQL_PORT: ${GRAPHQL_PORT:-20212}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - /apps/netalertx/data:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=${NETALERTX_UID:-20211},gid=${NETALERTX_GID:-20211},mode=1700,rw,noexec,nosuid,nodev,async,noatime,nodiratime
    expose:
      - 20211
      - 20212
    network_mode: ${NETALERTX_NETWORK_MODE:-host}
    dns:
      - ${ROUTER_IP:-192.168.0.1}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth netalertx ${IP_ADDRESS:-host.docker.internal}:20211
