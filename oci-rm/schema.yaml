title: "ARM Free Tier VPS"
description: "Creates an Ampere A1 (ARM) Always Free VPS on Oracle Cloud Infrastructure"
schemaVersion: 1.1.0
version: "20240522"
locale: "en"

variableGroups:
  - title: "General Configuration"
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region

  - title: "Instance Details"
    variables:
      - instance_display_name
      - availability_domain_number
      - instance_ocpus
      - instance_memory_in_gbs
      - boot_volume_size_in_gbs
      - enable_boot_volume_backup

  - title: "Operating System"
    variables:
      - instance_image_os_version

  - title: "Access and Automation"
    variables:
      - ssh_public_key
      - ssh_source_cidr
      - user_data

  - title: "Networking Setup"
    variables:
      - use_reserved_public_ip
      - vcn_display_name
      - vcn_cidr_block
      - subnet_cidr_block
      - tcp_ingress_ports
      - udp_ingress_ports

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    required: true
    visible: false

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "The compartment where the resources will be created."
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "The region to deploy the instance."
    required: true

  availability_domain_number:
    type: integer
    title: "Availability Domain"
    description: "Availability domain number (1, 2, or 3). Note: Most Free Tier accounts have limited AD availability."
    minimum: 1
    maximum: 3
    default: 1
    required: true

  instance_display_name:
    type: string
    title: "Instance Name"
    description: "A friendly name for the compute instance."
    default: "instance-ampere-a1-ubuntu"
    required: true

  instance_ocpus:
    type: integer
    title: "OCPUs"
    description: "Number of OCPUs. Always Free limit is 2 total across all A1 instances."
    minimum: 1
    maximum: 2
    default: 2
    required: true

  instance_memory_in_gbs:
    type: integer
    title: "Memory (GB)"
    description: "Memory in GB. Always Free limit is 12 GB total. Recommended ratio 1:6 (OCPU:GB)."
    minimum: 1
    maximum: 12
    default: 12
    required: true

  boot_volume_size_in_gbs:
    type: integer
    title: "Boot Volume Size (GB)"
    description: "Boot volume size in GB. Minimum 47 GB. Always Free allows 200 GB total block storage."
    minimum: 47
    maximum: 200
    default: 200
    required: true

  enable_boot_volume_backup:
    type: boolean
    title: "Enable Boot Volume Backup"
    description: "Weekly incremental backup every Sunday, retaining 4 weeks. Fits within Always Free 5-backup limit."
    default: false
    required: false

  instance_image_os_version:
    type: enum
    title: "OS Version"
    description: "Ubuntu version"
    enum:
      - "24.04"
      - "22.04"
      - "20.04"
    default: "24.04"
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH Public Key"
    description: "The public key to allow SSH access to the instance."
    required: true

  ssh_source_cidr:
    type: string
    title: "SSH Source CIDR"
    description: "Restrict SSH access to this CIDR block (e.g., your public IP /32)."
    default: "0.0.0.0/0"
    required: true

  user_data:
    type: text
    title: "Cloud-init Configuration"
    description: "Cloud-init configuration in YAML format (defaults to templates/cloud-init.yaml)."
    required: false
    default: ""

  use_reserved_public_ip:
    type: boolean
    title: "Use Reserved Public IP"
    description: "Assign a reserved (static) public IP that persists across instance recreations. Free when attached to an instance."
    default: false
    required: false

  vcn_display_name:
    type: string
    title: "VCN Name"
    description: "Name for the Virtual Cloud Network."
    default: "vcn-default"
    required: true

  vcn_cidr_block:
    type: string
    title: "VCN CIDR Block"
    description: "The primary CIDR block for the VCN."
    default: "10.0.0.0/16"
    required: true

  subnet_cidr_block:
    type: string
    title: "Subnet CIDR Block"
    description: "The CIDR block for the public subnet."
    default: "10.0.0.0/24"
    required: true

  tcp_ingress_ports:
    type: string
    title: "TCP Ingress Ports"
    description: "Comma-separated list of TCP ports to allow ingress (e.g., 80,443,9443)."
    default: "80,443,9443"
    required: false

  udp_ingress_ports:
    type: string
    title: "UDP Ingress Ports"
    description: "Comma-separated list of UDP ports to allow ingress (e.g., 443)."
    default: "443"
    required: false
