title: "ARM Free Tier VPS"
description: "Creates an Ampere A1 (ARM) Always Free VPS on Oracle Cloud Infrastructure"
schemaVersion: 1.1.0
version: "20240522"
locale: "en"

variableGroups:
  - title: "General Configuration"
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region

  - title: "Instance Details"
    variables:
      - instance_display_name
      - availability_domain_number
      - instance_ocpus
      - instance_memory_in_gbs
      - boot_volume_size_in_gbs

  - title: "Operating System Selection"
    variables:
      - instance_image_os
      - instance_image_os_version

  - title: "Access and Automation"
    variables:
      - ssh_public_key
      - ssh_source_cidr
      - user_data

  - title: "Networking Setup"
    variables:
      - vcn_display_name
      - vcn_cidr_block
      - subnet_cidr_block
      - tcp_ingress_ports
      - udp_ingress_ports

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    required: true
    visible: false

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "The compartment where the resources will be created."
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    description: "The region to deploy the instance."
    required: true

  availability_domain_number:
    type: integer
    title: "Availability Domain"
    description: "Availability domain number (1, 2, or 3). Note: Most Free Tier accounts have limited AD availability."
    minimum: 1
    maximum: 3
    default: 1
    required: true

  instance_display_name:
    type: string
    title: "Instance Name"
    description: "A friendly name for the compute instance."
    default: "arm-free-tier"
    required: true

  instance_ocpus:
    type: integer
    title: "OCPUs"
    description: "Number of OCPUs. Always Free limit is 4 total across all A1 instances."
    minimum: 1
    maximum: 4
    default: 4
    required: true

  instance_memory_in_gbs:
    type: integer
    title: "Memory (GB)"
    description: "Memory in GB. Always Free limit is 24 GB total. Recommended ratio 1:6 (OCPU:GB)."
    minimum: 1
    maximum: 24
    default: 24
    required: true

  boot_volume_size_in_gbs:
    type: integer
    title: "Boot Volume Size (GB)"
    description: "Boot volume size in GB. Minimum 47 GB. Always Free allows 200 GB total block storage."
    minimum: 47
    maximum: 200
    default: 200
    required: true

  instance_image_os:
    type: enum
    title: "Operating System"
    description: "The operating system to install on the instance."
    enum:
      - "Canonical Ubuntu"
      - "Oracle Linux"
    default: "Canonical Ubuntu"
    required: true

  instance_image_os_version:
    type: enum
    title: "OS Version"
    description: "Ubuntu: 24.04, 22.04, 20.04 | Oracle Linux: 9, 8"
    enum:
      - "24.04"
      - "22.04"
      - "20.04"
      - "9"
      - "8"
    default: "24.04"
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH Public Key"
    description: "The public key to allow SSH access to the instance."
    required: true

  ssh_source_cidr:
    type: string
    title: "SSH Source CIDR"
    description: "Restrict SSH access to this CIDR block (e.g., your public IP /32)."
    default: "0.0.0.0/0"
    required: true

  user_data:
    type: text
    title: "Cloud-init Configuration"
    description: "Cloud-init configuration in YAML format (defaults to templates/cloud-init.yaml)."
    required: false
    default: |
      #cloud-config
      package_update: true
      package_upgrade: true
      package_reboot_if_required: true

      ssh:
        permit_root_login: false
        password_authentication: false

      disable_root: true

      apt:
        unattended-upgrades:
          enable: true
          auto_reboot: true

      packages:
        - ufw
        - curl
        - git

      write_files:
        - path: /etc/sysctl.d/99-hardening.conf
          content: |
            # IP Spoofing protection
            net.ipv4.conf.all.rp_filter = 1
            net.ipv4.conf.default.rp_filter = 1
            # Ignore ICMP broadcast requests
            net.ipv4.icmp_echo_ignore_broadcasts = 1
            # Disable source packet routing
            net.ipv4.conf.all.accept_source_route = 0
            net.ipv6.conf.all.accept_source_route = 0
            net.ipv4.conf.default.accept_source_route = 0
            net.ipv6.conf.default.accept_source_route = 0
            # Ignore send redirects
            net.ipv4.conf.all.send_redirects = 0
            net.ipv4.conf.default.send_redirects = 0
            # Block SYN attacks
            net.ipv4.tcp_syncookies = 1
            net.ipv4.tcp_max_syn_backlog = 2048
            net.ipv4.tcp_synack_retries = 2
            net.ipv4.tcp_syn_retries = 5
            # Log Martians
            net.ipv4.conf.all.log_martians = 1
            net.ipv4.conf.default.log_martians = 1

      runcmd:
        # Flush iptables before enabling UFW
        - [ iptables, -P, INPUT, ACCEPT ]
        - [ iptables, -P, FORWARD, ACCEPT ]
        - [ iptables, -P, OUTPUT, ACCEPT ]
        - [ iptables, -t, nat, -F ]
        - [ iptables, -t, mangle, -F ]
        - [ iptables, -F ]
        - [ iptables, -X ]
        - [ sh, -c, "netfilter-persistent save || true" ]

        # Replace iptables with UFW
        - [ ufw, default, deny, incoming ]
        - [ ufw, default, allow, outgoing ]
        - [ ufw, allow, 22/tcp ]
        - [ ufw, allow, 80/tcp ]
        - [ ufw, allow, 443/tcp ]
        - [ ufw, allow, 443/udp ]
        - [ ufw, allow, 9443/tcp ]
        - [ ufw, --force, enable ]

        # Install Docker
        - [ sh, -c, "curl -fsSL https://get.docker.com -o get-docker.sh" ]
        - [ sh, get-docker.sh ]
        - [ sh, -c, "usermod -aG docker ubuntu || true" ]
        - [ sh, -c, "usermod -aG docker opc || true" ]
        - [ rm, get-docker.sh ]

  vcn_display_name:
    type: string
    title: "VCN Name"
    description: "Name for the Virtual Cloud Network."
    default: "vcn-free-tier"
    required: true

  vcn_cidr_block:
    type: string
    title: "VCN CIDR Block"
    description: "The primary CIDR block for the VCN."
    default: "10.0.0.0/16"
    required: true

  subnet_cidr_block:
    type: string
    title: "Subnet CIDR Block"
    description: "The CIDR block for the public subnet."
    default: "10.0.0.0/24"
    required: true

  tcp_ingress_ports:
    type: string
    title: "TCP Ingress Ports"
    description: "Comma-separated list of TCP ports to allow ingress (e.g., 80,443,9443)."
    default: "80,443,9443"
    required: false

  udp_ingress_ports:
    type: string
    title: "UDP Ingress Ports"
    description: "Comma-separated list of UDP ports to allow ingress (e.g., 443)."
    default: "443"
    required: false
