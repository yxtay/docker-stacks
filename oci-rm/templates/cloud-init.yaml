#cloud-config
package_update: true
package_upgrade: true
package_reboot_if_required: true

ssh:
  permit_root_login: false
  password_authentication: false

disable_root: true

apt:
  unattended-upgrades:
    enable: true
    auto_reboot: true

packages:
  - curl
  - git
  - iptables-persistent

write_files:
  - path: /etc/sysctl.d/99-hardening.conf
    content: |
      # IP Spoofing protection
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      # Ignore ICMP broadcast requests
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      # Disable source packet routing
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0
      # Ignore send redirects
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      # Block SYN attacks
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_max_syn_backlog = 2048
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_syn_retries = 5
      # Log Martians
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1

runcmd:
  # Disable UFW if active
  - [ufw, disable]

  # Configure iptables
  - [iptables, -I, INPUT, 1, -p, tcp, --dport, 22, -j, ACCEPT]
  - [iptables, -I, INPUT, 1, -p, tcp, --dport, 80, -j, ACCEPT]
  - [iptables, -I, INPUT, 1, -p, tcp, --dport, 443, -j, ACCEPT]
  - [iptables, -I, INPUT, 1, -p, udp, --dport, 443, -j, ACCEPT]
  - [iptables, -I, INPUT, 1, -p, tcp, --dport, 9443, -j, ACCEPT]
  - [sh, -c, "netfilter-persistent save"]

  # Install Docker
  - [sh, -c, "curl -fsSL https://get.docker.com -o get-docker.sh"]
  - [sh, get-docker.sh]
  - [sh, -c, "usermod -aG docker ubuntu || true"]
  - [sh, -c, "usermod -aG docker opc || true"]
  - [rm, get-docker.sh]
