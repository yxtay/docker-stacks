services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:85786f738bd82e95f2ca8dc04265c887494556f4029858121ab10fdad0dc6ddc
    command:
      - --file=/input/pangolin/config.template.yml
      - --out=/pangolin/config.yml
      - --file=/input/traefik/traefik.template.yml
      - --out=/traefik/traefik.yml
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./:/input:ro
      - /apps/pangolin:/pangolin
      - ./traefik:/traefik
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  pangolin:
    image: ghcr.io/fosrl/pangolin:1.26.0@sha256:a8285fd7c4ba400ef011dd62d4116e69298b51df242cdc4f26ba9f2b5d57ff6c
    depends_on:
      gomplate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/app/config
      - /apps/traefik/letsencrypt:/app/config/letsencrypt:ro
      - /apps/pangolin/cache:/app/.next/cache
      - /apps/geoip:/usr/share/GeoIP:ro
    tmpfs:
      - /tmp
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?}
    expose:
      - 3000
      - 3001
      - 3002
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:3001/api/v1/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2g
          pids: 512

  gerbil:
    image: ghcr.io/fosrl/gerbil:1.6.0@sha256:420f5210b6d1a6d3035f15c3938b5289fee5aeff51ffdcb9b217838338908885
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/var/config
    expose:
      - 3004
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 21820:21820/udp
      - 51820:51820/udp
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3004/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  traefik:
    image: ghcr.io/traefik/traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    depends_on:
      gomplate:
        condition: service_completed_successfully
      pangolin:
        condition: service_healthy
      gerbil:
        condition: service_healthy
        restart: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./traefik:/etc/traefik:ro
      - /apps/traefik/letsencrypt:/letsencrypt
      - /apps/traefik/plugins:/plugins-storage
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?}
      CROWDSEC_TRAEFIK_BOUNCER_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_KEY:?}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${LETSENCRYPT_EMAIL:-}
    network_mode: service:gerbil
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      pangolin.public-resources.traefik.name: traefik
      pangolin.public-resources.traefik.mode: http
      pangolin.public-resources.traefik.full-domain: "traefik.${DOMAIN:?}"
      pangolin.public-resources.traefik.auth.sso-enabled: true
      pangolin.public-resources.traefik.targets[0].hostname: gerbil
      pangolin.public-resources.traefik.targets[0].port: 8080
      pangolin.public-resources.traefik.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
