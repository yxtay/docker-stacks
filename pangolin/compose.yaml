services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:49628827462fb9cf0822832f9444fb633dee18e5b4f2eb6944ef909a001564d4
    command:
      - --file=/input/pangolin/config.template.yml
      - --out=/pangolin/config.yml
      - --file=/input/traefik/traefik.template.yml
      - --out=/traefik/traefik.yml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./:/input:ro
      - /apps/pangolin:/pangolin
      - ./traefik:/traefik
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  pangolin:
    image: ghcr.io/fosrl/pangolin:1.21.1@sha256:dd3ccdce1ae340b73a8b7dffcdd34dc1f73e81c7b2cce14b224d841822e4541d
    depends_on:
      gomplate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/app/config
      - /apps/pangolin/cache:/app/.next/cache
      - /apps/geoip:/usr/share/GeoIP:ro
    tmpfs:
      - /tmp
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?}
    expose:
      - 3000
      - 3001
      - 3002
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:3001/api/v1/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2g
          pids: 512

  gerbil:
    image: ghcr.io/fosrl/gerbil:1.4.3@sha256:35cf48759a18e7ef3a28302131c4beed75b217dc92dea16dabc6f20ca9627546
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/var/config
    expose:
      - 3004
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 21820:21820/udp
      - 51820:51820/udp
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3004/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  traefik:
    image: ghcr.io/traefik/traefik:v3.7.10@sha256:617c253c5d960e257ec153d582cc62f191461baba6863bd6b498ae062d3d5c19
    container_name: traefik
    depends_on:
      pangolin:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./traefik:/etc/traefik:ro
      - /apps/traefik/letsencrypt:/letsencrypt
      - /apps/traefik/plugins:/plugins-storage
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?}
      CROWDSEC_TRAEFIK_BOUNCER_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_KEY:?}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${LETSENCRYPT_EMAIL:-}
    network_mode: service:gerbil
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      pangolin.public-resources.traefik.name: traefik
      pangolin.public-resources.traefik.mode: http
      pangolin.public-resources.traefik.full-domain: "traefik.${DOMAIN:?}"
      pangolin.public-resources.traefik.auth.sso-enabled: true
      pangolin.public-resources.traefik.targets[0].hostname: gerbil
      pangolin.public-resources.traefik.targets[0].port: 8080
      pangolin.public-resources.traefik.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
