services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:8d91cb8e6c092039b44d9aafbd2d20c9d0e969b2c2ee4293f2c7b503784f1cd9
    command:
      - --file=/input/pangolin/config.template.yml
      - --out=/pangolin/config.yml
      - --file=/input/traefik/traefik.template.yml
      - --out=/traefik/traefik.yml
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./:/input:ro
      - /apps/pangolin:/pangolin
      - ./traefik:/traefik
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  pangolin:
    image: ghcr.io/fosrl/pangolin:1.22.1@sha256:f313d0738c4c470e79198f16c9b917eb83e960b7676941c2dc4fa04843340818
    depends_on:
      gomplate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/app/config
      - /apps/pangolin/cache:/app/.next/cache
      - /apps/geoip:/usr/share/GeoIP:ro
    tmpfs:
      - /tmp
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?}
    expose:
      - 3000
      - 3001
      - 3002
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:3001/api/v1/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2g
          pids: 512

  gerbil:
    image: ghcr.io/fosrl/gerbil:1.5.1@sha256:e8010d0354d7dc3b8cb1c80d1ae9d961c02e8b1fccc353ef1dfc37631722f7f6
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/var/config
    expose:
      - 3004
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 21820:21820/udp
      - 51820:51820/udp
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3004/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  traefik:
    image: ghcr.io/traefik/traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    depends_on:
      gomplate:
        condition: service_completed_successfully
      pangolin:
        condition: service_healthy
      gerbil:
        condition: service_healthy
        restart: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./traefik:/etc/traefik:ro
      - /apps/traefik/letsencrypt:/letsencrypt
      - /apps/traefik/plugins:/plugins-storage
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?}
      CROWDSEC_TRAEFIK_BOUNCER_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_KEY:?}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${LETSENCRYPT_EMAIL:-}
    network_mode: service:gerbil
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      pangolin.public-resources.traefik.name: traefik
      pangolin.public-resources.traefik.mode: http
      pangolin.public-resources.traefik.full-domain: "traefik.${DOMAIN:?}"
      pangolin.public-resources.traefik.auth.sso-enabled: true
      pangolin.public-resources.traefik.targets[0].hostname: gerbil
      pangolin.public-resources.traefik.targets[0].port: 8080
      pangolin.public-resources.traefik.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
