services:
  gomplate:
    image: ghcr.io/hairyhenderson/gomplate:latest@sha256:a5bc314a04aab42b20cc19ceee986128474605a17ed4e1d48191bdd2e6121cc4
    command:
      - --file=/input/pangolin/config.template.yml
      - --out=/pangolin/config.yml
      - --file=/input/traefik/traefik.template.yml
      - --out=/traefik/traefik.yml
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./:/input:ro
      - /apps/pangolin:/pangolin
      - ./traefik:/traefik
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4G
          pids: 512

  pangolin:
    image: ghcr.io/fosrl/pangolin:1.25.2@sha256:e652f01250e78f275861897daf479c0e2a07109b438b920f628600da79668b72
    depends_on:
      gomplate:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/app/config
      - /apps/pangolin/cache:/app/.next/cache
      - /apps/geoip:/usr/share/GeoIP:ro
    tmpfs:
      - /tmp
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?}
    expose:
      - 3000
      - 3001
      - 3002
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:3001/api/v1/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2g
          pids: 512

  gerbil:
    image: ghcr.io/fosrl/gerbil:1.5.2@sha256:1f6e64eaba7997282c7067ba19922fc7e46b5f73e1a27add3dd66a591d50512f
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/var/config
    expose:
      - 3004
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 21820:21820/udp
      - 51820:51820/udp
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3004/healthz"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  traefik:
    image: ghcr.io/traefik/traefik:v3.7.16@sha256:6d3e069ee484ab1da5adfdda555a75eb9b1545ef09096a0cc7c3043101986a20
    container_name: traefik
    depends_on:
      gomplate:
        condition: service_completed_successfully
      pangolin:
        condition: service_healthy
      gerbil:
        condition: service_healthy
        restart: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./traefik:/etc/traefik:ro
      - /apps/traefik/letsencrypt:/letsencrypt
      - /apps/traefik/plugins:/plugins-storage
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: ${PANGOLIN_DOMAIN:-pangolin.${DOMAIN}}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?}
      CROWDSEC_TRAEFIK_BOUNCER_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_KEY:?}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${LETSENCRYPT_EMAIL:-}
    network_mode: service:gerbil
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      pangolin.public-resources.traefik.name: traefik
      pangolin.public-resources.traefik.mode: http
      pangolin.public-resources.traefik.full-domain: "traefik.${DOMAIN:?}"
      pangolin.public-resources.traefik.auth.sso-enabled: true
      pangolin.public-resources.traefik.targets[0].hostname: gerbil
      pangolin.public-resources.traefik.targets[0].port: 8080
      pangolin.public-resources.traefik.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
