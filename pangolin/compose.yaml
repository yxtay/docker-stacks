services:
  pangolin:
    image: docker.io/fosrl/pangolin:latest
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/pangolin:/app/config
      - ./config/config.yml:/app/config/config.yml:ro
    tmpfs:
      - /tmp
    environment:
      SERVER_SECRET: ${SERVER_SECRET:?}
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:3001/api/v1/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2g
          pids: 512

  gerbil:
    image: docker.io/fosrl/gerbil:latest
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    depends_on:
      pangolin:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/pangolin:/var/config
      - ./config/config.yml:/var/config/config.yml:ro
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      - 21820:21820/udp
      - 51820:51820/udp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  traefik:
    image: docker.io/traefik:v3.6
    container_name: traefik
    depends_on:
      pangolin:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - /apps/traefik/letsencrypt:/letsencrypt
      - /apps/traefik/plugins:/plugins-storage
    tmpfs:
      - /tmp
    environment:
      DOMAIN: ${DOMAIN:?}
      PANGOLIN_DOMAIN: pangolin.${DOMAIN:?}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?}
      CROWDSEC_TRAEFIK_BOUNCER_KEY: ${CROWDSEC_TRAEFIK_BOUNCER_KEY:?}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${LETSENCRYPT_EMAIL:-}
    network_mode: service:gerbil
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: pangolin
