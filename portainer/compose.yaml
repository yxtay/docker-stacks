services:
  portainer:
    # nosemgrep
    image: portainer/portainer-ce:lts@sha256:d27f76194b719bfe2a34779d51798a7adf02510cfba69ebcb538267f75aa4f47
    command: --data ${PORTAINER_DATA:?} --log-mode JSON
    volumes:
      - ${PORTAINER_DATA}:/data
      - ${PORTAINER_DATA}:${PORTAINER_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9443:9443
    expose:
      - 8000
      - 9000
    healthcheck:
      test: [CMD, /portainer, --version]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth portainer portainer:9000

networks:
  default:
    name: public_default
    external: true
