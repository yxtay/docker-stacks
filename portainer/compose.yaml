services:
  portainer:
    # nosemgrep
    image: portainer/portainer-ce:2.42.0@sha256:c3c919ec68d130cbcb837693420592b91afd320b28b492c16c84ec5561bbf095
    command: --data ${PORTAINER_DATA:?} --log-mode JSON
    volumes:
      - ${PORTAINER_DATA}:/data
      - ${PORTAINER_DATA}:${PORTAINER_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9443:9443
    expose:
      - 8000
      - 9000
    healthcheck:
      test: [CMD, /portainer, --version]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth portainer portainer:9000

networks:
  default:
    name: public_default
    external: true
