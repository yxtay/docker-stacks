services:
  portainer:
    image: portainer/portainer-ce:lts
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # to allow using relative path, mount /data for portainer_data
      - /data:/data
    ports:
      - 9443:9443
    expose:
      - 8000
      - 9000
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy portainer portainer:9000

