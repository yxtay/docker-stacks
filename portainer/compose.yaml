services:
  portainer:
    # nosemgrep
    image: portainer/portainer-ce:2.43.0@sha256:707366c811956fe077135a6633af67e698529612869711cdb24896c892b28feb
    command: --data ${PORTAINER_DATA:?} --log-mode JSON
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ${PORTAINER_DATA}:/data
      - ${PORTAINER_DATA}:${PORTAINER_DATA}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9443:9443
    expose:
      - 8000
      - 9000
    healthcheck:
      test: [CMD, /portainer, --version]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth portainer portainer:9000

networks:
  default:
    name: proxy
    external: true
