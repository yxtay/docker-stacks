services:
  caddy:
    image: ghcr.io/serfriz/caddy-duckdns-ddns-crowdsec-geoip-security-dockerproxy:2.11.3
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:2019/config"]
    environment:
      CADDY_DOCKER_CADDYFILE_PATH: /srv/Caddyfile
      DOCKER_HOST: tcp://socket_proxy:2375
      DOMAIN: ${DOMAIN:?}
    secrets:
      - duckdns_token
    volumes:
      - ./caddy:/srv
      - /apps/caddy:/data
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks:
      - default
      - socket_proxy
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:version-d67e71cc
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?}
      - FILE__TOKEN=/run/secrets/duckdns_token
    secrets:
      - duckdns_token
    restart: unless-stopped

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v5.0.7
    environment:
      DOCKER_HOST: tcp://socket_proxy:2375
      TINYAUTH_APPURL: https://tinyauth.${DOMAIN:?}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRETFILE: /run/secrets/github_oauth_client_secret
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRETFILE: /run/secrets/google_oauth_client_secret
      TINYAUTH_OAUTH_WHITELIST: ${TINYAUTH_OAUTH_WHITELIST:?}
    secrets:
      - github_oauth_client_secret
      - google_oauth_client_secret
    volumes:
      - /apps/tinyauth:/data
    expose:
      - 3000
    networks:
      - default
      - socket_proxy
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy tinyauth tinyauth:3000

  socket_proxy:
    image: ghcr.io/linuxserver/socket-proxy:3.2.19
    environment:
      TZ: ${TZ:-UTC}
      POST: 0

      # containers
      CONTAINERS: 1
      EXEC: 0
      # post only
      ALLOW_START: 1 # dozzle
      ALLOW_STOP: 1 # dozzle
      ALLOW_RESTARTS: 1 # autoheal

      # images
      IMAGES: 0
      # post only
      BUILD: 0
      COMMIT: 0

      # networks / volumes / plugins
      NETWORKS: 1 # caddy
      VOLUMES: 0
      PLUGINS: 0

      # swarm
      CONFIGS: 1 # caddy
      NODES: 0
      SECRETS: 0
      SERVICES: 1 # caddy
      SWARM: 0
      TASKS: 0

      # system
      # get only
      DISTRIBUTION: 0
      EVENTS: 1
      INFO: 1 # caddy
      PING: 1
      SYSTEM: 0
      VERSION: 1
      # post only
      AUTH: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run
    expose:
      - 2375
    networks:
      - socket_proxy
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:2375/_ping"]
    restart: unless-stopped
    read_only: true

  whoami:
    image: ghcr.io/traefik/whoami:v1.11.0
    expose:
      - 80
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth whoami whoami:80

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin:2.23.0
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth httpbin httpbin:8080

  librespeed:
    image: ghcr.io/librespeed/speedtest:6.1.0
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth librespeed librespeed:8080

networks:
  socket_proxy:
    name: socket_proxy

secrets:
  duckdns_token:
    environment: DUCKDNS_TOKEN
  github_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRET
  google_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET
