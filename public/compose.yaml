services:
  caddy:
    image: ghcr.io/serfriz/caddy-duckdns-ddns-crowdsec-geoip-security-dockerproxy:2.11.3
    healthcheck:
      test: [CMD, wget, --spider, "http://127.0.0.1:2019/config"]
    environment:
      DOMAIN: ${DOMAIN:?}
      CADDY_DOCKER_CADDYFILE_PATH: /srv/Caddyfile
    secrets:
      - duckdns_token
    volumes:
      - ./caddy:/srv
      - /data/caddy:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    restart: unless-stopped

  duckdns:
    image: lscr.io/linuxserver/duckdns:version-d67e71cc
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?}
      - FILE__TOKEN=/run/secrets/duckdns_token
    secrets:
      - duckdns_token
    restart: unless-stopped

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v5.0.7
    environment:
      TINYAUTH_APPURL: https://tinyauth.${DOMAIN:?}
      TINYAUTH_OAUTH_WHITELIST: ${TINYAUTH_OAUTH_WHITELIST:?}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRETFILE: /run/secrets/github_oauth_client_secret
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRETFILE: /run/secrets/google_oauth_client_secret
    secrets:
      - github_oauth_client_secret
      - google_oauth_client_secret
    expose:
      - 3000
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy tinyauth tinyauth:3000

  whoami:
    image: ghcr.io/traefik/whoami:v1.11.0
    expose:
      - 80
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth whoami whoami:80

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin:2.21.0
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth httpbin httpbin:8080

  librespeed:
    image: ghcr.io/librespeed/speedtest:6.1.0
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth librespeed librespeed:8080

secrets:
  duckdns_token:
    environment: DUCKDNS_TOKEN
  github_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRET
  google_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET
