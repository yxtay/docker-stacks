services:
  caddy:
    # nosemgrep
    image: ghcr.io/serfriz/caddy-duckdns-ddns-crowdsec-geoip-security-dockerproxy:2.11.4@sha256:d2486aeb3524ceb8412910c86f2f3e5f42fff2cbbfb9857f935a4006326e50b7
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, "http://127.0.0.1:2019/config"]
    environment:
      DOMAIN: ${DOMAIN:?}
      CADDY_DOCKER_CADDYFILE_PATH: /srv/Caddyfile
    secrets:
      - duckdns_token
    volumes:
      - ./caddy:/srv
      - /apps/caddy:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    restart: unless-stopped

  duckdns:
    # nosemgrep
    image: lscr.io/linuxserver/duckdns:version-d67e71cc@sha256:424dbc5a5db5388ad4c197882eac475c5bfad2be1e02a761692946d406591b17
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAINS:?}
      - FILE__TOKEN=/run/secrets/duckdns_token
    secrets:
      - duckdns_token
    restart: unless-stopped

  tinyauth:
    # nosemgrep
    image: ghcr.io/steveiliop56/tinyauth:v5.0.7@sha256:0793c71c49906e079d90c7e693cded9df569217a92d717dc9b171f2116fcd1c6
    environment:
      TINYAUTH_APPURL: https://tinyauth.${DOMAIN:?}
      TINYAUTH_OAUTH_WHITELIST: ${TINYAUTH_OAUTH_WHITELIST:?}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRETFILE: /run/secrets/github_oauth_client_secret
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID: ${TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTID:-}
      TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRETFILE: /run/secrets/google_oauth_client_secret
    secrets:
      - github_oauth_client_secret
      - google_oauth_client_secret
    volumes:
      - /apps/tinyauth:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - 3000
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy tinyauth tinyauth:3000

  whoami:
    # nosemgrep
    image: ghcr.io/traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    expose:
      - 80
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth whoami whoami:80

  httpbin:
    # nosemgrep
    image: ghcr.io/mccutchen/go-httpbin:2.23.0@sha256:b5d2ef3378e61138998cb4e60edf117000594f33b9be504825921190a7109e69
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth httpbin httpbin:8080

  librespeed:
    # nosemgrep
    image: ghcr.io/librespeed/speedtest:6.1.0@sha256:b6b0890047e833158370d59ed5ef289b3e67a58f4a363cd37ef5c09d170d8543
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth librespeed librespeed:8080

secrets:
  duckdns_token:
    environment: DUCKDNS_TOKEN
  github_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GITHUB_CLIENTSECRET
  google_oauth_client_secret:
    environment: TINYAUTH_OAUTH_PROVIDERS_GOOGLE_CLIENTSECRET
