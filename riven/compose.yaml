services:
  riven:
    # nosemgrep
    image: ghcr.io/rivenmedia/riven-ts:main@sha256:97ed9a4ba817fa68e5764ce45f0dd9eea1e9704f46a4d86041e9d74d2d907736
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RIVEN_SETTING__host: 0.0.0.0
      RIVEN_SETTING__databaseUrl: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RIVEN_SETTING__redisUrl: redis://redis:6379
      RIVEN_SETTING__rankingConfigPath: /app/data/riven-ranking-config.json
      RIVEN_FRONTEND_SETTING__origin: https://riven.${DOMAIN:?}
      RIVEN_FRONTEND_SETTING__passkeyRpId: riven.${DOMAIN:?}
    env_file:
      - .env
    cap_add:
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/riven/data:/app/data
      - /apps/riven/logs:/app/logs
      - /mnt/remote:/mnt/remote:rshared
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:3000/api/auth/ok"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512

  riven-frontend:
    # nosemgrep
    image: ghcr.io/rivenmedia/riven-ts-frontend:main@sha256:96a0f84a4bbcb293b0e8027d5746c0fd68826e968551ccd35b7a53855ad92af6
    depends_on:
      riven:
        condition: service_healthy
    environment:
      ORIGIN: https://riven.${DOMAIN:?}
      BACKEND_URL: http://riven:3000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /app/apps/frontend/.next/cache
    expose:
      - 9000
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/9000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth riven riven-frontend:9000
      tinyauth.apps.riven.path.allow: \/api\/auth
      pangolin.public-resources.riven.name: riven
      pangolin.public-resources.riven.mode: http
      pangolin.public-resources.riven.full-domain: "riven.${DOMAIN:?}"
      pangolin.public-resources.riven.auth.sso-enabled: true
      pangolin.public-resources.riven.rules[0].action: allow
      pangolin.public-resources.riven.rules[0].match: path
      pangolin.public-resources.riven.rules[0].value: /api/auth/*
      pangolin.public-resources.riven.rules[0].enabled: true
      pangolin.public-resources.riven.targets[0].hostname: riven-frontend
      pangolin.public-resources.riven.targets[0].port: 9000
      pangolin.public-resources.riven.targets[0].method: http

  postgres:
    # nosemgrep
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGDATABASE: ${POSTGRES_DB}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/riven/db:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  redis:
    # nosemgrep
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: redis-server --maxmemory-policy noeviction
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
  proxy:
    name: proxy
    external: true
