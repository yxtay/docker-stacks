services:
  riven:
    # nosemgrep
    image: ghcr.io/rivenmedia/riven-ts:main@sha256:7fe1fefe7d3a6aa09e11a762523780c93f8a27a9309dce1b88ec5e5bef6d7129
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RIVEN_SETTING__host: 0.0.0.0
      RIVEN_SETTING__databaseUrl: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RIVEN_SETTING__redisUrl: redis://redis:6379
      RIVEN_SETTING__rankingConfigPath: /app/data/riven-ranking-config.json
      RIVEN_FRONTEND_SETTING__origin: https://riven.${DOMAIN:?}
      RIVEN_FRONTEND_SETTING__passkeyRpId: riven.${DOMAIN:?}
    env_file:
      - .env
    cap_add:
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    read_only: true
    volumes:
      - /apps/riven/data:/app/data
      - /apps/riven/logs:/app/logs
      - /mnt/remote:/mnt/remote:rshared
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:3000/api/auth/ok"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512

  riven-frontend:
    # nosemgrep
    image: ghcr.io/rivenmedia/riven-ts-frontend:main@sha256:fbc24964dd6d6d4f946d9a731c89a5ec842bc6679169c04121d7f4aa2e7d30ff
    depends_on:
      riven:
        condition: service_healthy
    environment:
      ORIGIN: https://riven.${DOMAIN:?}
      BACKEND_URL: http://riven:3000
      BACKEND_API_KEY: ${RIVEN_SETTING__apiKey:?}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /app/apps/frontend/.next/cache
    expose:
      - 9000
    networks:
      - default
      - proxy
    healthcheck:
      test: [CMD, bash, -c, ":>/dev/tcp/localhost/9000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth riven riven-frontend:9000
      tinyauth.apps.riven.path.allow: \/api\/auth
      pangolin.public-resources.riven.name: riven
      pangolin.public-resources.riven.mode: http
      pangolin.public-resources.riven.full-domain: "riven.${DOMAIN:?}"
      pangolin.public-resources.riven.auth.sso-enabled: true
      pangolin.public-resources.riven.rules[0].action: allow
      pangolin.public-resources.riven.rules[0].match: path
      pangolin.public-resources.riven.rules[0].value: /api/auth/*
      pangolin.public-resources.riven.rules[0].enabled: true
      pangolin.public-resources.riven.targets[0].hostname: riven-frontend
      pangolin.public-resources.riven.targets[0].port: 9000
      pangolin.public-resources.riven.targets[0].method: http

  postgres:
    # nosemgrep
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGDATABASE: ${POSTGRES_DB}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/riven/db:/var/lib/postgresql
    tmpfs:
      - /etc/postgresql
      - /run
    healthcheck:
      test: [CMD, pg_isready]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  redis:
    # nosemgrep
    image: ghcr.io/valkey-io/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    command: valkey-server --maxmemory 5gb --maxmemory-policy volatile-lru
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/riven/cache:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 6g
          pids: 512

networks:
  default:
  proxy:
    name: proxy
    external: true
