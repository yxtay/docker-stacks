services:
  crowdsec:
    # nosemgrep
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    environment:
      COLLECTIONS: >-
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/caddy
        crowdsecurity/iptables
        crowdsecurity/linux
        crowdsecurity/traefik
      DOCKER_HOST: tcp://socket-proxy:2375
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    uts: host
    volumes:
      - /apps/crowdsec/config:/etc/crowdsec
      - /apps/crowdsec/data:/var/lib/crowdsec/data
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - /var/log:/var/log:ro
    tmpfs:
      - /tmp
    expose:
      - 7422
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - default
      - socket-proxy
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:8080/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  crowdsec-firewall-bouncer:
    # nosemgrep
    image: ghcr.io/shgew/cs-firewall-bouncer-docker:v0.0.36@sha256:4a7bd2e3eda81f9382f6e8571cebff7192e9b300e99d1cd5993b3b03580a0cb8
    # Optional non-root mode:
    # user: 1000:1000
    depends_on:
      crowdsec:
        condition: service_healthy
    environment:
      API_URL: http://localhost:8080
      API_KEY: ${CROWDSEC_FIREWALL_BOUNCER_KEY:-}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    security_opt: # In non-root mode, remove this block.
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./crowdsec-firewall-bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    tmpfs:
      - /tmp
    network_mode: host
    healthcheck:
      test: [CMD, pidof, crowdsec-firewall-bouncer]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

networks:
  default:
    name: proxy
    external: true
  socket-proxy:
    name: socket-proxy
    external: true
