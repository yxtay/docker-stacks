services:
  sencho:
    extends:
      file: ./compose.yaml
      service: sencho
    environment:
      COMPOSE_DIR: ${COMPOSE_DIR:?}
      SENCHO_MODE: pilot
      SENCHO_PRIMARY_URL: ${SENCHO_PRIMARY_URL:?}
      SENCHO_ENROLL_TOKEN: ${SENCHO_ENROLL_TOKEN:?}
    ports: !reset []

networks:
  default:
    name: caddy
    external: true
