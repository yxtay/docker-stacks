services:
  sencho:
    image: ghcr.io/studio-saelix/sencho:0.94.1@sha256:c636f85bc988bd9fdd730f9898f8ac0ae24906c4fd32fce10225ca9b7132fe4c
    environment:
      COMPOSE_DIR: ${COMPOSE_DIR:?}
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sencho:/app/data
      - ${COMPOSE_DIR:-${HOME}}:${COMPOSE_DIR:-${HOME}}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    ports:
      - 1852:1852
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sencho sencho:1852
      tinyauth.apps.sencho.path.allow: \/pilot

networks:
  default:
    name: proxy
    external: true
