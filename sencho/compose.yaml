services:
  sencho:
    image: ghcr.io/studio-saelix/sencho:0.93.0@sha256:72919d52739b5ae765af9a5a3a8c07291c88d5fb315aa2d9082c5c6fe009b96a
    environment:
      COMPOSE_DIR: ${COMPOSE_DIR:?}
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sencho:/app/data
      - ${COMPOSE_DIR:-${HOME}}:${COMPOSE_DIR:-${HOME}}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    ports:
      - 1852:1852
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sencho {{ upstreams 1852 }}
      tinyauth.apps.sencho.path.allow: \/pilot

networks:
  default:
    name: proxy
    external: true
