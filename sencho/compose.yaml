services:
  sencho:
    image: ghcr.io/studio-saelix/sencho:0.93.1@sha256:a53036e013a362b8b4daa1f4a7177487bb0e4a6a02f7c635ed4e74b120e30271
    environment:
      COMPOSE_DIR: ${COMPOSE_DIR:?}
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sencho:/app/data
      - ${COMPOSE_DIR:-${HOME}}:${COMPOSE_DIR:-${HOME}}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    ports:
      - 1852:1852
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sencho {{ upstreams 1852 }}
      tinyauth.apps.sencho.path.allow: \/pilot

networks:
  default:
    name: proxy
    external: true
