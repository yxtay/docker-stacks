services:
  sencho:
    image: ghcr.io/studio-saelix/sencho:0.93.4@sha256:ddc7efd06c39f6b90303d93979d436c23c3a44befe82ee97c7e90053c5016eb3
    environment:
      COMPOSE_DIR: ${COMPOSE_DIR:?}
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sencho:/app/data
      - ${COMPOSE_DIR:-${HOME}}:${COMPOSE_DIR:-${HOME}}
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    ports:
      - 1852:1852
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sencho sencho:1852
      tinyauth.apps.sencho.path.allow: \/pilot

networks:
  default:
    name: proxy
    external: true
