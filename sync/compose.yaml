services:
  rsync:
    image: instrumentisto/rsync-ssh:alpine3.23@sha256:6cbad37c2fbdca4ac7ad9d1c1bb8990af9efd4dc76321b349935876cbb1e9e4a
    tty: false
    command:
      - rsync
      - --archive
      - --hard-links
      - --acls
      - --xattrs
      - --one-file-system
      - --delete-after
      - --no-links
      - --numeric-ids
      - --partial
      - --sparse
      - --exclude-from=/config/exclude.txt
      - /apps/
      - /data/apps/
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      # - FOWNER
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./rsync:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    restart: no

  rclone:
    image: ghcr.io/rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    tty: false
    command:
      - sync
      - /apps/
      - /data/apps/
      - --exclude-from
      - /config/exclude.txt
      - --exclude-if-present
      - .github
      - --exclude-if-present
      - .gitignore
      - --exclude-if-present
      - .nobackup
      - --exclude-if-present
      - CACHEDIR.TAG
      - --ignore-case
      - --one-file-system
      - --skip-links
      - --track-renames
    cap_add:
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./rsync:/config:ro
      - /apps:/apps:ro
      - /data/apps:/data/apps
    restart: no
