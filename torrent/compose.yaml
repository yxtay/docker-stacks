services:
  flaresolverr:
    # nosemgrep
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/flaresolverr:/config
    expose:
      - 8191
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8191/health"]
    restart: unless-stopped

  prowlarr:
    # nosemgrep
    image: ghcr.io/linuxserver/prowlarr:2.4.0@sha256:3950b5e48cf4ba9dab78fe14038dd7f062e66b7b4ab368b02c94a13f6a3dae9f
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/prowlarr:/config
    tmpfs:
      - /run:exec
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696

  rclone:
    # nosemgrep
    image: ghcr.io/rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    entrypoint: [sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/remote/debrid 2> /dev/null || true &&
      exec rclone mount debrid: /mnt/remote/debrid
      --uid ${PUID:-1000}
      --gid ${PGID:-1000}
      --allow-other
      --attr-timeout 1m
      --dir-cache-time 5m
      --poll-interval 1m
      --buffer-size 64M
      --cache-dir /config/rclone/cache
      --vfs-cache-mode full
      --vfs-cache-max-age 1d
      --vfs-cache-max-size 20G
      --vfs-fast-fingerprint
      --vfs-read-ahead 64M
      --vfs-read-chunk-size 1M
      --vfs-read-chunk-size-limit 32M
      --no-checksum
      --no-modtime
      --read-only
      --log-format json
      "
    environment:
      <<: *envs
      RCLONE_CONFIG_DEBRID_TYPE: webdav
      RCLONE_CONFIG_DEBRID_VENDOR: other
      RCLONE_CONFIG_DEBRID_URL: ${RCLONE_CONFIG_DEBRID_URL:?}
      RCLONE_CONFIG_DEBRID_USER: ${RCLONE_CONFIG_DEBRID_USER:?}
      RCLONE_CONFIG_DEBRID_PASS: ${RCLONE_CONFIG_DEBRID_PASS:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /mnt/remote:/mnt/remote:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/remote/debrid ", /proc/mounts]
    restart: unless-stopped

  rdtclient:
    # nosemgrep
    image: ghcr.io/rogerfar/rdtclient:2.0.138@sha256:8232cb0ddcf56805109872466c1f934843e72291513ee0b967367927645ec0d1
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/rdtclient:/data/db
      - /mnt/torrent:/mnt/torrent
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 6500
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth rdtclient rdtclient:6500

  radarr:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.2.1@sha256:1e95b5c13fe015361a9ae1c4d99fc2336816790aaea60fa74b2ffebe076a69e0
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/radarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr radarr:7878

  sonarr:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.18@sha256:916844aff737c06c12066be9146cc604c104cec66eb8e07e545cb3719a4b771a
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sonarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr sonarr:8989

  profilarr:
    # nosemgrep
    image: ghcr.io/dictionarry-hub/profilarr:2.0.9@sha256:7a9b5112ff227320d17c65ab643a5d875713e6235991ef04a8e482ec51427902
    environment:
      <<: *envs
      ORIGIN: https://profilarr.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868

networks:
  default:
    name: caddy
    external: true
