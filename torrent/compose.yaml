services:
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.3.5
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/prowlarr:/config
      - /mnt/torrent:/mnt/torrent:rslave
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696

  rclone:
    image: ghcr.io/rclone/rclone:1.74.2
    entrypoint: [sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/torrent/debrid 2> /dev/null || true &&
      mkdir -p /mnt/torrent/debrid &&
      chown ${PUID:-1000}:${PGID:-1000} /mnt/torrent &&
      exec rclone mount debrid: /mnt/torrent/debrid
      --uid ${PUID:-1000}
      --gid ${PGID:-1000}
      --allow-other
      --links
      --use-cookies
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 1d
      --vfs-cache-min-free-space 1G
      --vfs-fast-fingerprint
      --buffer-size 0
      --vfs-read-ahead 1G
      --vfs-read-chunk-streams 4
      --vfs-read-chunk-size-limit 1G
      --dir-cache-time 1m
      --attr-timeout 10m
      --no-checksum
      --no-modtime
      --log-format json
      "
    environment: *envs
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /mnt/torrent:/mnt/torrent:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/torrent/debrid ", /proc/mounts]
    restart: unless-stopped

  rdtclient:
    image: ghcr.io/rogerfar/rdtclient:2.0.136
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/rdtclient:/data/db
      - /mnt/torrent:/mnt/torrent:rslave
    expose:
      - 6500
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth rdtclient rdtclient:6500

  radarr_torrent:
    image: ghcr.io/linuxserver/radarr:6.1.1
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_torrent:/config
      - /mnt/torrent:/mnt/torrent:rslave
      - /data:/data
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_torrent radarr_torrent:7878

  sonarr_torrent:
    image: ghcr.io/linuxserver/sonarr:4.0.17
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_torrent:/config
      - /mnt/torrent:/mnt/torrent:rslave
      - /data:/data
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_torrent sonarr_torrent:8989

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.0.7
    environment:
      <<: *envs
      ORIGIN: https://profilarr.${DOMAIN:?}
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868

networks:
  default:
    name: public_default
    external: true
