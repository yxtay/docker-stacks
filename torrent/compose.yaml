services:
  valkey:
    # nosemgrep
    image: ghcr.io/valkey-io/valkey:9.1.0@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    command: [valkey-server, --save, "", --appendonly, "no"]
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    networks:
      - trawl
    healthcheck:
      test: [CMD, valkey-cli, ping]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  trawl:
    # nosemgrep
    image: ghcr.io/germondai/trawl:1.0.0@sha256:f282af7cf88072dd777698f7fbc554e0ccc39830c3d6e7670aa84cb347495303
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      REDIS_URL: redis://valkey:6379
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    expose:
      - 8191
    networks:
      - default
      - trawl
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8191/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  prowlarr:
    # nosemgrep
    image: ghcr.io/linuxserver/prowlarr:2.4.0@sha256:4fd7a166c8f46dd3370a871c250ee577d6c2ae97a0dbe0e3614b5ef736205620
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/prowlarr:/config
    tmpfs:
      - /run:exec
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696
      tinyauth.apps.prowlarr.path.allow: \/(download|search)
      pangolin.public-resources.prowlarr.name: prowlarr
      pangolin.public-resources.prowlarr.mode: http
      pangolin.public-resources.prowlarr.full-domain: "prowlarr.${DOMAIN:?}"
      pangolin.public-resources.prowlarr.auth.sso-enabled: true
      pangolin.public-resources.prowlarr.targets[0].hostname: prowlarr
      pangolin.public-resources.prowlarr.targets[0].port: 9696
      pangolin.public-resources.prowlarr.targets[0].method: http
      pangolin.public-resources.prowlarr.rules[0].action: allow
      pangolin.public-resources.prowlarr.rules[0].match: path
      pangolin.public-resources.prowlarr.rules[0].value: "*/download/*"
      pangolin.public-resources.prowlarr.rules[0].enabled: true
      pangolin.public-resources.prowlarr.rules[1].action: allow
      pangolin.public-resources.prowlarr.rules[1].match: path
      pangolin.public-resources.prowlarr.rules[1].value: "*/search/*"
      pangolin.public-resources.prowlarr.rules[1].enabled: true

  rclone:
    # nosemgrep
    image: ghcr.io/rclone/rclone:1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
    entrypoint: [sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/remote/debrid 2> /dev/null || true &&
      exec rclone mount debrid: /mnt/remote/debrid
      --uid ${PUID:-911}
      --gid ${PGID:-911}
      --allow-other
      --attr-timeout 1m
      --dir-cache-time 5m
      --poll-interval 1m
      --buffer-size 64M
      --cache-dir /config/rclone/cache
      --vfs-cache-mode full
      --vfs-cache-max-age 1d
      --vfs-cache-max-size 20G
      --vfs-fast-fingerprint
      --vfs-read-ahead 64M
      --vfs-read-chunk-size 1M
      --vfs-read-chunk-size-limit 32M
      --no-checksum
      --no-modtime
      --read-only
      --log-format json
      "
    environment:
      RCLONE_CONFIG_DEBRID_TYPE: webdav
      RCLONE_CONFIG_DEBRID_VENDOR: other
      RCLONE_CONFIG_DEBRID_URL: ${RCLONE_CONFIG_DEBRID_URL:?}
      RCLONE_CONFIG_DEBRID_USER: ${RCLONE_CONFIG_DEBRID_USER:?}
      RCLONE_CONFIG_DEBRID_PASS: ${RCLONE_CONFIG_DEBRID_PASS:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /mnt/remote:/mnt/remote:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/remote/debrid ", /proc/mounts]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  rdtclient:
    # nosemgrep
    image: ghcr.io/rogerfar/rdtclient:2.0.140@sha256:3f5f37783da704d50bcc6773ffa22eaed86fd4bfbd225a7929e181c6774ead29
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/rdtclient:/data/db
      - /mnt/torrent:/mnt/torrent
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 6500
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth rdtclient rdtclient:6500
      pangolin.public-resources.rdtclient.name: rdtclient
      pangolin.public-resources.rdtclient.mode: http
      pangolin.public-resources.rdtclient.full-domain: "rdtclient.${DOMAIN:?}"
      pangolin.public-resources.rdtclient.auth.sso-enabled: true
      pangolin.public-resources.rdtclient.targets[0].hostname: rdtclient
      pangolin.public-resources.rdtclient.targets[0].port: 6500
      pangolin.public-resources.rdtclient.targets[0].method: http

  decypharr:
    # nosemgrep
    image: ghcr.io/sirrobot01/decypharr:v2.4@sha256:d9df495fd156a379abd5b760ad54ed960881408599cd045c4d552a6d20bc7ce6
    environment:
      PUID: 911
      PGID: 911
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    # read_only: true
    volumes:
      - /apps/decypharr:/app
      - /apps/decypharr/cache:/cache
      - /mnt/torrent:/mnt/torrent
    #   - /mnt/remote:/mnt/remote:rshared
    # tmpfs:
    #   - /run:exec
    expose:
      - 8282
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth decypharr decypharr:8282
      pangolin.public-resources.decypharr.name: decypharr
      pangolin.public-resources.decypharr.mode: http
      pangolin.public-resources.decypharr.full-domain: "decypharr.${DOMAIN:?}"
      pangolin.public-resources.decypharr.auth.sso-enabled: true
      pangolin.public-resources.decypharr.targets[0].hostname: decypharr
      pangolin.public-resources.decypharr.targets[0].port: 8282
      pangolin.public-resources.decypharr.targets[0].method: http

  radarr:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.3.0@sha256:2b2c1c05eb3f648d2c80dfab9486147dd7bb0ad4d77fa972fc1c5de8f1da3738
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/radarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr radarr:7878
      pangolin.public-resources.radarr.name: radarr
      pangolin.public-resources.radarr.mode: http
      pangolin.public-resources.radarr.full-domain: "radarr.${DOMAIN:?}"
      pangolin.public-resources.radarr.auth.sso-enabled: true
      pangolin.public-resources.radarr.targets[0].hostname: radarr
      pangolin.public-resources.radarr.targets[0].port: 7878
      pangolin.public-resources.radarr.targets[0].method: http

  sonarr:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.19@sha256:4b025354d338999e03bf6dbdadcdde94815d39d4a5aba5de3cdc86a56d7d6c51
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sonarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr sonarr:8989
      pangolin.public-resources.sonarr.name: sonarr
      pangolin.public-resources.sonarr.mode: http
      pangolin.public-resources.sonarr.full-domain: "sonarr.${DOMAIN:?}"
      pangolin.public-resources.sonarr.auth.sso-enabled: true
      pangolin.public-resources.sonarr.targets[0].hostname: sonarr
      pangolin.public-resources.sonarr.targets[0].port: 8989
      pangolin.public-resources.sonarr.targets[0].method: http

  profilarr:
    # nosemgrep
    image: ghcr.io/dictionarry-hub/profilarr:2.0.9@sha256:7a9b5112ff227320d17c65ab643a5d875713e6235991ef04a8e482ec51427902
    environment:
      ORIGIN: https://profilarr.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868
      pangolin.public-resources.profilarr.name: profilarr
      pangolin.public-resources.profilarr.mode: http
      pangolin.public-resources.profilarr.full-domain: "profilarr.${DOMAIN:?}"
      pangolin.public-resources.profilarr.auth.sso-enabled: true
      pangolin.public-resources.profilarr.targets[0].hostname: profilarr
      pangolin.public-resources.profilarr.targets[0].port: 6868
      pangolin.public-resources.profilarr.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
  trawl:
    internal: true
