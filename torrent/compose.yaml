services:
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:latest
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/prowlarr:/config
      - /mount/torrent:/mount/torrent:rslave
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fSs, "http://localhost:9696/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy prowlarr prowlarr:9696

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    environment: *envs
    volumes:
      - /apps/radarr:/config
      - /mount/torrent:/mount/torrent:rslave
      - /data:/data
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fSs, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy radarr radarr:7878

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    environment: *envs
    volumes:
      - /apps/sonarr:/config
      - /mount/torrent:/mount/torrent:rslave
      - /data:/data
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fSs, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy sonarr sonarr:8989

  profilarr:
    image: santiagosayshey/profilarr:latest
    environment: *envs
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:6868/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy profilarr profilarr:6868

  rdtclient:
    image: ghcr.io/rogerfar/rdtclient:latest
    depends_on:
      rclone:
        condition: service_healthy
    volumes:
      - /apps/rdtclient:/data/db
      - /mount/torrent:/mount/torrent:rslave
    expose:
      - 6500
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy rdtclient rdtclient:6500

  rclone:
    image: ghcr.io/rclone/rclone:latest
    entrypoint: [/bin/sh, -c]
    command: |-
      fusermount3 -uz /mount/torrent/debrid 2> /dev/null || true
      exec rclone mount debrid: /mount/torrent/debrid \
        --uid=${PUID:-1000} \
        --gid=${PGID:-1000} \
        --allow-other \
        --links \
        --use-cookies \
        --vfs-cache-mode=full \
        --vfs-cache-max-size=20G \
        --vfs-cache-max-age=1d \
        --vfs-fast-fingerprint \
        --vfs-read-ahead=1G \
        --buffer-size=0M \
        --dir-cache-time=1m \
        --attr-timeout=10m \
        --no-checksum \
        --no-modtime \
        --log-format json
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /mount/torrent:/mount/torrent:rshared
    healthcheck:
      test: [CMD-SHELL, "grep -q ' /mount/torrent/debrid ' /proc/mounts"]
    restart: unless-stopped

networks:
  default:
    name: public_default
    external: true
