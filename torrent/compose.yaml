services:
  byparr:
    # nosemgrep
    image: ghcr.io/thephaseless/byparr:main
    expose:
      - 8191
    restart: unless-stopped

  prowlarr:
    # nosemgrep
    image: ghcr.io/linuxserver/prowlarr:2.4.0@sha256:a46d0ce0a8236bc4e065fe7c91a55d026c9d849620c5845250519b977d8857f3
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/prowlarr:/config
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696

  rclone:
    # nosemgrep
    image: ghcr.io/rclone/rclone:1.74.3@sha256:623378ad0ff3ebd5cebf77720843c0e02edfe46e2d5b5ac6bed54c6371780dfb
    entrypoint: [sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/remote/debrid 2> /dev/null || true &&
      mkdir -p /mnt/remote/debrid &&
      chown ${PUID:-1000}:${PGID:-1000} /mnt/remote &&
      exec rclone mount debrid: /mnt/remote/debrid
      --uid ${PUID:-1000}
      --gid ${PGID:-1000}
      --allow-other
      --links
      --use-cookies
      --no-checksum
      --no-modtime
      --dir-cache-time 1m
      --attr-timeout 10m
      --cache-dir /var/cache/rclone
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 1d
      --vfs-cache-min-free-space 1G
      --vfs-fast-fingerprint
      --vfs-read-ahead 1G
      --vfs-read-chunk-streams 4
      --vfs-read-chunk-size-limit 1G
      --buffer-size 0
      --log-format json
      "
    environment:
      <<: *envs
      RCLONE_CONFIG_DEBRID_TYPE: webdav
      RCLONE_CONFIG_DEBRID_VENDOR: other
      RCLONE_CONFIG_DEBRID_URL: ${RCLONE_CONFIG_DEBRID_URL:?}
      RCLONE_CONFIG_DEBRID_USER: ${RCLONE_CONFIG_DEBRID_USER:?}
      RCLONE_CONFIG_DEBRID_PASS: ${RCLONE_CONFIG_DEBRID_PASS:?}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /apps/rclone/cache:/var/cache/rclone
      - /mnt/remote:/mnt/remote:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/remote/debrid ", /proc/mounts]
    restart: unless-stopped

  rdtclient:
    # nosemgrep
    image: ghcr.io/rogerfar/rdtclient:2.0.138@sha256:8232cb0ddcf56805109872466c1f934843e72291513ee0b967367927645ec0d1
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/rdtclient:/data/db
      - /mnt/torrent:/mnt/torrent
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 6500
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth rdtclient rdtclient:6500

  radarr_torrent:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.2.1@sha256:4c490ccd44d31feb49dc4cc542f2148a420fc1ae0c1ba94e59b39ba4bf112716
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_torrent:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_torrent radarr_torrent:7878

  sonarr_torrent:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.17@sha256:0b3f344388bd7bed4f2f770058de795e76447e4a481b83c8d5f8fed489371fde
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_torrent:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_torrent sonarr_torrent:8989

  profilarr:
    # nosemgrep
    image: ghcr.io/dictionarry-hub/profilarr:2.0.8@sha256:bcec9c579358163004145105c2747d3513ae75a56cd8b6c3ac759a0166d5b4af
    environment:
      <<: *envs
      ORIGIN: https://profilarr.${DOMAIN:?}
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868

networks:
  default:
    name: public_default
    external: true
