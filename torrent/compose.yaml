services:
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.3.5@sha256:2489c6dbaf11e3a6d71aeb2e6980d04193d4af611aa7064a974851222fd41722
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/prowlarr:/config
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696

  rclone:
    image: ghcr.io/rclone/rclone:1.74.2@sha256:9ce0d49b611d3781233e25334e9e23d7af01e5546da7087f90d55f034ef13637
    entrypoint: [sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/remote/debrid 2> /dev/null || true &&
      mkdir -p /mnt/remote/debrid &&
      chown ${PUID:-1000}:${PGID:-1000} /mnt/remote &&
      exec rclone mount debrid: /mnt/remote/debrid
      --uid ${PUID:-1000}
      --gid ${PGID:-1000}
      --allow-other
      --links
      --use-cookies
      --no-checksum
      --no-modtime
      --dir-cache-time 1m
      --attr-timeout 10m
      --cache-dir /var/cache/rclone
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 1d
      --vfs-cache-min-free-space 1G
      --vfs-fast-fingerprint
      --vfs-read-ahead 1G
      --vfs-read-chunk-streams 4
      --vfs-read-chunk-size-limit 1G
      --buffer-size 0
      --log-format json
      "
    environment:
      <<: *envs
      RCLONE_CONFIG_DEBRID_TYPE: webdav
      RCLONE_CONFIG_DEBRID_VENDOR: other
      RCLONE_CONFIG_DEBRID_URL: ${RCLONE_CONFIG_DEBRID_URL:?}
      RCLONE_CONFIG_DEBRID_USER: ${RCLONE_CONFIG_DEBRID_USER:?}
      RCLONE_CONFIG_DEBRID_PASS: ${RCLONE_CONFIG_DEBRID_PASS:?}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone/cache:/var/cache/rclone
      - /mnt/remote:/mnt/remote:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/remote/debrid ", /proc/mounts]
    restart: unless-stopped

  rdtclient:
    image: ghcr.io/rogerfar/rdtclient:2.0.136@sha256:a05f0427946a4c3c64dc9d556c017f9a181acec320ecf218b6334a1066c11d1f
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/rdtclient:/data/db
      - /mnt/torrent:/mnt/torrent
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 6500
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth rdtclient rdtclient:6500

  radarr_torrent:
    image: ghcr.io/linuxserver/radarr:6.1.1@sha256:c0a4335d4249b46102f64cf6fa27ffc3bddfd9138fac1e4ddf238afd37f02d1f
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_torrent:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_torrent radarr_torrent:7878

  sonarr_torrent:
    image: ghcr.io/linuxserver/sonarr:4.0.17@sha256:0b3f344388bd7bed4f2f770058de795e76447e4a481b83c8d5f8fed489371fde
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_torrent:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_torrent sonarr_torrent:8989

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.0.7@sha256:9b49da18dd896dbe4b6c797e39cb8b0787ab166f5e5956df647295f23ae496cc
    environment:
      <<: *envs
      ORIGIN: https://profilarr.${DOMAIN:?}
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868

networks:
  default:
    name: public_default
    external: true
