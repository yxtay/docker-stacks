services:
  trawl:
    # nosemgrep
    image: ghcr.io/germondai/trawl:1.4.2@sha256:86b1fdf26cfeebd996eeedaeb774002434f4cf8d02e5486f8a8173373c4d6e9b
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    expose:
      - 8191
    networks:
      - default
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8191/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512

  prowlarr:
    # nosemgrep
    image: ghcr.io/linuxserver/prowlarr:2.5.2@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/prowlarr:/config
    tmpfs:
      - /run:exec
    expose:
      - 9696
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:9696/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth prowlarr prowlarr:9696
      tinyauth.apps.prowlarr.path.allow: \/(download|search)
      pangolin.public-resources.prowlarr.name: prowlarr
      pangolin.public-resources.prowlarr.mode: http
      pangolin.public-resources.prowlarr.full-domain: "prowlarr.${DOMAIN:?}"
      pangolin.public-resources.prowlarr.auth.sso-enabled: true
      pangolin.public-resources.prowlarr.targets[0].hostname: prowlarr
      pangolin.public-resources.prowlarr.targets[0].port: 9696
      pangolin.public-resources.prowlarr.targets[0].method: http
      pangolin.public-resources.prowlarr.rules[0].action: allow
      pangolin.public-resources.prowlarr.rules[0].match: path
      pangolin.public-resources.prowlarr.rules[0].value: "*/download/*"
      pangolin.public-resources.prowlarr.rules[0].enabled: true
      pangolin.public-resources.prowlarr.rules[1].action: allow
      pangolin.public-resources.prowlarr.rules[1].match: path
      pangolin.public-resources.prowlarr.rules[1].value: "*/search/*"
      pangolin.public-resources.prowlarr.rules[1].enabled: true

  decypharr:
    # nosemgrep
    image: ghcr.io/sirrobot01/decypharr:v2.5@sha256:a65c62a18843ca3dfa73cdee5eecccd3732d98f3ff845ae8338a1caf7060dd1a
    environment:
      PUID: 911
      PGID: 911
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/decypharr:/app
      - /apps/decypharr/cache:/cache
      - /mnt/torrent:/mnt/torrent
      - /mnt/remote:/mnt/remote:rshared
    expose:
      - 8282
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth decypharr decypharr:8282
      pangolin.public-resources.decypharr.name: decypharr
      pangolin.public-resources.decypharr.mode: http
      pangolin.public-resources.decypharr.full-domain: "decypharr.${DOMAIN:?}"
      pangolin.public-resources.decypharr.auth.sso-enabled: true
      pangolin.public-resources.decypharr.targets[0].hostname: decypharr
      pangolin.public-resources.decypharr.targets[0].port: 8282
      pangolin.public-resources.decypharr.targets[0].method: http

  radarr:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.3.0@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/radarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr radarr:7878
      pangolin.public-resources.radarr.name: radarr
      pangolin.public-resources.radarr.mode: http
      pangolin.public-resources.radarr.full-domain: "radarr.${DOMAIN:?}"
      pangolin.public-resources.radarr.auth.sso-enabled: true
      pangolin.public-resources.radarr.targets[0].hostname: radarr
      pangolin.public-resources.radarr.targets[0].port: 7878
      pangolin.public-resources.radarr.targets[0].method: http

  sonarr:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.19@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sonarr:/config
      - /mnt/torrent:/mnt/torrent
      - /mnt/torrent:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr sonarr:8989
      pangolin.public-resources.sonarr.name: sonarr
      pangolin.public-resources.sonarr.mode: http
      pangolin.public-resources.sonarr.full-domain: "sonarr.${DOMAIN:?}"
      pangolin.public-resources.sonarr.auth.sso-enabled: true
      pangolin.public-resources.sonarr.targets[0].hostname: sonarr
      pangolin.public-resources.sonarr.targets[0].port: 8989
      pangolin.public-resources.sonarr.targets[0].method: http

  profilarr:
    # nosemgrep
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0@sha256:ddcdd0f340043c2ec0a85ca74b9a6be9be42b1c0288c75fc36a26a43f695860b
    environment:
      ORIGIN: https://profilarr.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:6868"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868
      pangolin.public-resources.profilarr.name: profilarr
      pangolin.public-resources.profilarr.mode: http
      pangolin.public-resources.profilarr.full-domain: "profilarr.${DOMAIN:?}"
      pangolin.public-resources.profilarr.auth.sso-enabled: true
      pangolin.public-resources.profilarr.targets[0].hostname: profilarr
      pangolin.public-resources.profilarr.targets[0].port: 6868
      pangolin.public-resources.profilarr.targets[0].method: http

networks:
  default:
    name: proxy
    external: true
