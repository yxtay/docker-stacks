services:
  nzbhydra2:
    # nosemgrep
    image: lscr.io/linuxserver/nzbhydra2:8.8.4@sha256:15f3fdd5e8ca21218c5f9aae0a2a2aaa47e600519c9d7caa81a5ebf23235ed01
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/nzbhydra2:/config
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbhydra2 nzbhydra2:5076
      tinyauth.apps.nzbhydra2.path.allow: \/api

  nzbdav:
    # nosemgrep
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /apps/nzbdav:/config
      - /mnt/usenet:/mnt/usenet
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav nzbdav:3000
      tinyauth.apps.nzbdav.path.allow: \/(api$|content)

  usenetstreamer:
    # nosemgrep
    image: ghcr.io/sanket9225/usenetstreamer:1.8.0@sha256:63d40e380ff9f420c1524c65a759ac9f7de18f648eae2488828704e4f8c2d8ab
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/usenetstreamer:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth usenetstreamer usenetstreamer:7000
      tinyauth.apps.usenetstreamer.path.allow: \/(manifest|nzb|stream)

  streamnzb:
    # nosemgrep
    image: ghcr.io/gaisberg/streamnzb:v4.7.0@sha256:744fa988038af6b376335c74a44225603148a7c2bad218188bbef876ab5f974c
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/streamnzb:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth streamnzb streamnzb:7000
      tinyauth.apps.streamnzb.path.allow: \/(manifest|play|stream)

  altmount:
    # nosemgrep
    image: ghcr.io/javi11/altmount:v0.2.0@sha256:2592723a519248340e43fa5a564cff01f3faf24f680ba4d8a1ae84f2e87c2cd2
    environment:
      <<: *envs
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SYS_ADMIN
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
      - /mnt/usenet:/mnt/usenet
      - /mnt/remote:/mnt/remote:rshared
    tmpfs:
      - /run:exec
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth altmount altmount:8080
      tinyauth.apps.altmount.path.allow: \/(sabnzbd|stream|stremio|webdav)

  radarr_usenet:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.2.1@sha256:1e95b5c13fe015361a9ae1c4d99fc2336816790aaea60fa74b2ffebe076a69e0
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/radarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_usenet radarr_usenet:7878

  sonarr_usenet:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.17@sha256:02bc962946fef994e67a38152446df25c10a52f8583aefeeb6467f9dd44cab99
    environment: *envs
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/sonarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    tmpfs:
      - /run:exec
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_usenet sonarr_usenet:8989

networks:
  default:
    name: caddy
    external: true
