services:
  nzbhydra2:
    # nosemgrep
    image: lscr.io/linuxserver/nzbhydra2:8.8.1@sha256:4ff03448e36fd653842b81b398ba686da4bd9fcd9edf1f78fc5a07eef64a2caa
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/nzbhydra2:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbhydra2 nzbhydra2:5076

  nzbdav:
    # nosemgrep
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    environment: *envs
    volumes:
      - /apps/nzbdav:/config
      - /mnt/usenet:/mnt/usenet
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav nzbdav:3000

  usenetstreamer:
    # nosemgrep
    image: ghcr.io/sanket9225/usenetstreamer:1.7.12@sha256:765f74a09559471a17c05fe58da092359f9e62c6b2303fe59dbe479d71181b22
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    volumes:
      - /apps/usenetstreamer:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy usenetstreamer usenetstreamer:7000

  streamnzb:
    # nosemgrep
    image: ghcr.io/gaisberg/streamnzb:v4.7.0@sha256:744fa988038af6b376335c74a44225603148a7c2bad218188bbef876ab5f974c
    volumes:
      - /apps/streamnzb:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy streamnzb streamnzb:7000

  altmount:
    # nosemgrep
    image: ghcr.io/javi11/altmount:v0.2.0@sha256:2592723a519248340e43fa5a564cff01f3faf24f680ba4d8a1ae84f2e87c2cd2
    environment:
      <<: *envs
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
      - /mnt/usenet:/mnt/usenet
      - /mnt/remote:/mnt/remote:rshared
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy altmount altmount:8080

  radarr_usenet:
    # nosemgrep
    image: ghcr.io/linuxserver/radarr:6.1.1@sha256:c0a4335d4249b46102f64cf6fa27ffc3bddfd9138fac1e4ddf238afd37f02d1f
    depends_on:
      altmount:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_usenet radarr_usenet:7878

  sonarr_usenet:
    # nosemgrep
    image: ghcr.io/linuxserver/sonarr:4.0.17@sha256:0b3f344388bd7bed4f2f770058de795e76447e4a481b83c8d5f8fed489371fde
    depends_on:
      altmount:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_usenet sonarr_usenet:8989

networks:
  default:
    name: public_default
    external: true
