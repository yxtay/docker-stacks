services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:v3.9.1-ls7
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /data/nzbhydra2:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy nzbhydra2 nzbhydra2:5076

  streamnzb:
    image: ghcr.io/gaisberg/streamnzb:v4.7.0
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /data/streamnzb:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy streamnzb streamnzb:7000

  nzbdav:
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /data/nzbdav:/config
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy nzbdav nzbdav:3000

  usenetstreamer:
    image: ghcr.io/sanket9225/usenetstreamer:1.7.12
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    volumes:
      - /data/usenetstreamer:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy usenetstreamer usenetstreamer:7000

  usenet_ultimate:
    image: ghcr.io/dsmart33/usenet-ultimate:v1.4.1
    volumes:
      - /data/usenet_ultimate:/app/config
    expose:
      - 1337
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy usenet_ultimate usenet_ultimate:1337

networks:
  default:
    name: public_default
    external: true
