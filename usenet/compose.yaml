      pangolin.public-resources.altmount.rules[0].match: path
      pangolin.public-resources.altmount.rules[0].value: "*/sabnzbd/*"
      pangolin.public-resources.altmount.rules[0].enabled: true
      pangolin.public-resources.altmount.rules[1].action: allow
