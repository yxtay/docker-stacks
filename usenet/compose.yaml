    image: ghcr.io/javi11/altmount:0.3.2@sha256:cd02c5ee4a840a6a3fef486846ab9e1e61d704d7a04def9e53783b29add2ba0b
    environment:
      # PUID/PGID has no effect with read_only: true
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth altmount altmount:8080
      tinyauth.apps.altmount.path.allow: \/(sabnzbd|stream|stremio|webdav)
