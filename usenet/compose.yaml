services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:8.8.1
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/nzbhydra2:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy nzbhydra2 nzbhydra2:5076

  nzbdav:
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4
    environment: *envs
    volumes:
      - /apps/nzbdav:/config
      - /mnt/usenet:/mnt/usenet:rslave
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy nzbdav nzbdav:3000

  rclone:
    image: ghcr.io/rclone/rclone:1.74.2
    entrypoint: [/bin/sh]
    command: >-
      -c "
      fusermount3 -uz /mnt/usenet/nzbdav 2> /dev/null || true &&
      exec rclone mount nzbdav: /mnt/usenet/nzbdav
      --uid ${PUID:-1000}
      --gid ${PGID:-1000}
      --allow-other
      --links
      --use-cookies
      --vfs-cache-mode full
      --vfs-cache-max-size 20G
      --vfs-cache-max-age 1d
      --vfs-fast-fingerprint
      --vfs-read-ahead 1G
      --buffer-size 0M
      --dir-cache-time 1m
      --attr-timeout 10m
      --no-checksum
      --no-modtime
      --log-format json
      "
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    environment: *envs
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/rclone:/config/rclone
      - /mnt/usenet:/mnt/usenet:rshared
    healthcheck:
      test: [CMD, grep, -q, " /mnt/usenet/nzbdav ", /proc/mounts]
    restart: unless-stopped

  radarr_usenet:
    image: ghcr.io/linuxserver/radarr:6.1.1
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_usenet:/config
      - /mnt/usenet:/mnt/usenet:rslave
      - /mnt/usenet:/data:rslave
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_usenet radarr_usenet:7878

  sonarr_usenet:
    image: ghcr.io/linuxserver/sonarr:4.0.17
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_usenet:/config
      - /mnt/usenet:/mnt/usenet:rslave
      - /mnt/usenet:/data:rslave
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_usenet sonarr_usenet:8989

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.0.7
    environment:
      !!merge <<: *envs
      ORIGIN: https://profilarr.${DOMAIN:?}
    volumes:
      - /apps/profilarr:/config
    expose:
      - 6868
    healthcheck:
      test: [CMD, bash, -c, ":> /dev/tcp/localhost/6868"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth profilarr profilarr:6868

  usenetstreamer:
    image: ghcr.io/sanket9225/usenetstreamer:1.7.12
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    volumes:
      - /apps/usenetstreamer:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy usenetstreamer usenetstreamer:7000

  streamnzb:
    image: ghcr.io/gaisberg/streamnzb:v4.7.0
    volumes:
      - /apps/streamnzb:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy streamnzb streamnzb:7000

networks:
  default:
    name: public_default
    external: true
