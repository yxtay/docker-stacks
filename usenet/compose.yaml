services:
  nzbdav:
    # nosemgrep
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    environment:
      # dotnet/aspnet default uid, gid required with read_only: true
      PUID: 1654
      PGID: 1654
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/nzbdav:/config
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav nzbdav:3000
      tinyauth.apps.nzbdav.path.allow: \/(api$|content)
      pangolin.public-resources.nzbdav.name: nzbdav
      pangolin.public-resources.nzbdav.mode: http
      pangolin.public-resources.nzbdav.full-domain: "nzbdav.${DOMAIN:?}"
      pangolin.public-resources.nzbdav.auth.sso-enabled: true
      pangolin.public-resources.nzbdav.targets[0].hostname: nzbdav
      pangolin.public-resources.nzbdav.targets[0].port: 3000
      pangolin.public-resources.nzbdav.targets[0].method: http
      pangolin.public-resources.nzbdav.rules[0].action: allow
      pangolin.public-resources.nzbdav.rules[0].match: path
      pangolin.public-resources.nzbdav.rules[0].value: "*/api"
      pangolin.public-resources.nzbdav.rules[0].enabled: true
      pangolin.public-resources.nzbdav.rules[1].action: allow
      pangolin.public-resources.nzbdav.rules[1].match: path
      pangolin.public-resources.nzbdav.rules[1].value: "*/content/*"
      pangolin.public-resources.nzbdav.rules[1].enabled: true

  usenetstreamer:
    # nosemgrep
    image: ghcr.io/sanket9225/usenetstreamer:1.8.2@sha256:62912b8cd79a1aedc9388a2e367cf68ccdefb2863353008d56a56452123a6389
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/usenetstreamer:/data/config
    tmpfs:
      - /usr/src/app/cache
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth usenetstreamer usenetstreamer:7000
      tinyauth.apps.usenetstreamer.path.allow: \/(manifest.json|nzb|stream)
      pangolin.public-resources.usenetstreamer.name: usenetstreamer
      pangolin.public-resources.usenetstreamer.mode: http
      pangolin.public-resources.usenetstreamer.full-domain: "usenetstreamer.${DOMAIN:?}"
      pangolin.public-resources.usenetstreamer.auth.sso-enabled: true
      pangolin.public-resources.usenetstreamer.targets[0].hostname: usenetstreamer
      pangolin.public-resources.usenetstreamer.targets[0].port: 7000
      pangolin.public-resources.usenetstreamer.targets[0].method: http
      pangolin.public-resources.usenetstreamer.rules[0].action: allow
      pangolin.public-resources.usenetstreamer.rules[0].match: path
      pangolin.public-resources.usenetstreamer.rules[0].value: "*/manifest.json"
      pangolin.public-resources.usenetstreamer.rules[0].enabled: true
      pangolin.public-resources.usenetstreamer.rules[1].action: allow
      pangolin.public-resources.usenetstreamer.rules[1].match: path
      pangolin.public-resources.usenetstreamer.rules[1].value: "*/nzb/*"
      pangolin.public-resources.usenetstreamer.rules[1].enabled: true
      pangolin.public-resources.usenetstreamer.rules[2].action: allow
      pangolin.public-resources.usenetstreamer.rules[2].match: path
      pangolin.public-resources.usenetstreamer.rules[2].value: "*/stream/*"
      pangolin.public-resources.usenetstreamer.rules[2].enabled: true

  streamnzb:
    # nosemgrep
    image: ghcr.io/gaisberg/streamnzb:v4.8.0@sha256:344a67b188452911777ac3309bba5a443e9b19db2c0b1f3991c9aaa0ae9b86dd
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/streamnzb:/app/data
    tmpfs:
      - /tmp
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth streamnzb streamnzb:7000
      tinyauth.apps.streamnzb.path.allow: \/(failover_order|manifest.json|stream)
      pangolin.public-resources.streamnzb.name: streamnzb
      pangolin.public-resources.streamnzb.mode: http
      pangolin.public-resources.streamnzb.full-domain: "streamnzb.${DOMAIN:?}"
      pangolin.public-resources.streamnzb.auth.sso-enabled: true
      pangolin.public-resources.streamnzb.targets[0].hostname: streamnzb
      pangolin.public-resources.streamnzb.targets[0].port: 7000
      pangolin.public-resources.streamnzb.targets[0].method: http
      pangolin.public-resources.streamnzb.rules[0].action: allow
      pangolin.public-resources.streamnzb.rules[0].match: path
      pangolin.public-resources.streamnzb.rules[0].value: "*/failover_order/*"
      pangolin.public-resources.streamnzb.rules[0].enabled: true
      pangolin.public-resources.streamnzb.rules[1].action: allow
      pangolin.public-resources.streamnzb.rules[1].match: path
      pangolin.public-resources.streamnzb.rules[1].value: "*/manifest.json"
      pangolin.public-resources.streamnzb.rules[1].enabled: true
      pangolin.public-resources.streamnzb.rules[2].action: allow
      pangolin.public-resources.streamnzb.rules[2].match: path
      pangolin.public-resources.streamnzb.rules[2].value: "*/stream*/*"
      pangolin.public-resources.streamnzb.rules[2].enabled: true

  altmount:
    # nosemgrep
    image: ghcr.io/javi11/altmount:0.3.1@sha256:d57e56f8d651c2e6d33f549ea1424f17e14e81296f1272e3d8c3dc76ae56ebff
    environment:
      # PUID/PGID has no effect with read_only: true
      TZ: ${TZ:-UTC}
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth altmount altmount:8080
      tinyauth.apps.altmount.path.allow: \/(sabnzbd|stream|stremio|webdav)
      pangolin.public-resources.altmount.name: altmount
      pangolin.public-resources.altmount.mode: http
      pangolin.public-resources.altmount.full-domain: "altmount.${DOMAIN:?}"
      pangolin.public-resources.altmount.auth.sso-enabled: true
      pangolin.public-resources.altmount.targets[0].hostname: altmount
      pangolin.public-resources.altmount.targets[0].port: 8080
      pangolin.public-resources.altmount.targets[0].method: http
      pangolin.public-resources.altmount.rules[0].action: allow
      pangolin.public-resources.altmount.rules[0].match: path
      pangolin.public-resources.altmount.rules[0].value: "*/sabnzbd/*"
      pangolin.public-resources.altmount.rules[0].enabled: true
      pangolin.public-resources.altmount.rules[1].action: allow
      pangolin.public-resources.altmount.rules[1].match: path
      pangolin.public-resources.altmount.rules[1].value: "*/stream*/*"
      pangolin.public-resources.altmount.rules[1].enabled: true
      pangolin.public-resources.altmount.rules[2].action: allow
      pangolin.public-resources.altmount.rules[2].match: path
      pangolin.public-resources.altmount.rules[2].value: "*/stremio/*"
      pangolin.public-resources.altmount.rules[2].enabled: true
      pangolin.public-resources.altmount.rules[3].action: allow
      pangolin.public-resources.altmount.rules[3].match: path
      pangolin.public-resources.altmount.rules[3].value: "*/webdav/*"
      pangolin.public-resources.altmount.rules[3].enabled: true

  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.4.2
    environment:
      SECRET_KEY: ${AIOSTREAMS_SECRET_KEY:?}
      BASE_URL: "https://aiostreams.${DOMAIN:?}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/aiostreams:/app/data
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/api/v1/status"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth aiostreams aiostreams:3000
      tinyauth.apps.aiostreams.path.allow: \/stremio
      pangolin.public-resources.aiostreams.name: aiostreams
      pangolin.public-resources.aiostreams.mode: http
      pangolin.public-resources.aiostreams.full-domain: "aiostreams.${DOMAIN:?}"
      pangolin.public-resources.aiostreams.auth.sso-enabled: true
      pangolin.public-resources.aiostreams.targets[0].hostname: aiostreams
      pangolin.public-resources.aiostreams.targets[0].port: 3000
      pangolin.public-resources.aiostreams.targets[0].method: http
      pangolin.public-resources.aiostreams.rules[0].action: allow
      pangolin.public-resources.aiostreams.rules[0].match: path
      pangolin.public-resources.aiostreams.rules[0].value: "*/stremio/*"
      pangolin.public-resources.aiostreams.rules[0].enabled: true

networks:
  default:
    name: proxy
    external: true
