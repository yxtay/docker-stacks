services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - nzbhydra2_data:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped

  streamnzb:
    image: ghcr.io/gaisberg/streamnzb:latest
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - streamnzb_data:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/"]
    restart: unless-stopped

  nzbdav:
    image: ghcr.io/nzbdav-dev/nzbdav:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - nzbdav_data:/config
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped

  usenetstreamer:
    image: ghcr.io/sanket9225/usenetstreamer:latest
    environment:
      ADDON_BASE_URL: ${USENETSTREAMER_BASE_URL:-}
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:-}
      ADDON_STREAM_TOKEN: ${USENETSTREAMER_STREAM_TOKEN:-}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    volumes:
      - usenetstreamer_data:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped

volumes:
  nzbhydra2_data:
  streamnzb_data:
  nzbdav_data:
  usenetstreamer_data:

networks:
  default:
    name: portainer_default
    external: true
