services:
  nzbhydra2:
    # checkov:skip=CKV_DOCKER_3: User managed via PUID/PGID
    # checkov:skip=CKV_DOCKER_7: Using latest tag for convenience
    image: ghcr.io/linuxserver/nzbhydra2:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - BASEURL=${NZBHYDRA_BASE_URL:-}
    volumes:
      - nzbhydra2_data:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/"]
    restart: unless-stopped

  streamnzb:
    # checkov:skip=CKV_DOCKER_3: Runs as root/internally managed
    # checkov:skip=CKV_DOCKER_7: Using latest tag for convenience
    image: ghcr.io/gaisberg/streamnzb:latest
    environment:
      - ADDON_BASE_URL=${STREAMNZB_BASE_URL:-}
    volumes:
      - streamnzb_data:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -nvO-, "http://localhost:7000/"]
    restart: unless-stopped

  nzbdav:
    # checkov:skip=CKV_DOCKER_3: User managed via PUID/PGID
    # checkov:skip=CKV_DOCKER_7: Using latest tag for convenience
    image: ghcr.io/nzbdav-dev/nzbdav:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - BASE_URL=${NZBDAV_BASE_URL:-}
    volumes:
      - nzbdav_data:/config
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -nvO-, "http://localhost:3000/"]
    restart: unless-stopped

  usenetstreamer:
    # checkov:skip=CKV_DOCKER_3: Runs as root/internally managed
    # checkov:skip=CKV_DOCKER_7: Using latest tag for convenience
    image: ghcr.io/sanket9225/usenetstreamer:latest
    environment:
      - ADDON_SHARED_SECRET=${USENETSTREAMER_ADDON_SHARED_SECRET}
      - ADDON_BASE_URL=${USENETSTREAMER_BASE_URL:-}
      - ADDON_STREAM_TOKEN=${USENETSTREAMER_STREAM_TOKEN:-}
      - CONFIG_DIR=/data/config
    volumes:
      - usenetstreamer_data:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -nvO-, "http://localhost:7000/"]
    restart: unless-stopped

volumes:
  nzbhydra2_data:
  streamnzb_data:
  nzbdav_data:
  usenetstreamer_data:

networks:
  default:
    name: dokploy-network
    external: true
