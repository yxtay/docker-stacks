services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:8.8.1
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - /apps/nzbhydra2:/config
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbhydra2 nzbhydra2:5076

  nzbdav:
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4
    environment: *envs
    volumes:
      - /apps/nzbdav:/config
      - /mnt/usenet:/mnt/usenet
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav nzbdav:3000

  usenetstreamer:
    image: ghcr.io/sanket9225/usenetstreamer:1.7.12
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    volumes:
      - /apps/usenetstreamer:/data/config
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy usenetstreamer usenetstreamer:7000

  streamnzb:
    image: ghcr.io/gaisberg/streamnzb:v4.7.0
    volumes:
      - /apps/streamnzb:/app/data
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy streamnzb streamnzb:7000

  altmount:
    image: ghcr.io/javi11/altmount:v0.2.0
    environment:
      <<: *envs
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
      - /mnt/usenet:/mnt/usenet
      - /mnt/remote:/mnt/remote:rshared
    expose:
      - 8080
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy altmount altmount:8080

  radarr_usenet:
    image: ghcr.io/linuxserver/radarr:6.1.1
    depends_on:
      altmount:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/radarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 7878
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:7878/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth radarr_usenet radarr_usenet:7878

  sonarr_usenet:
    image: ghcr.io/linuxserver/sonarr:4.0.17
    depends_on:
      altmount:
        condition: service_healthy
        restart: true
    environment: *envs
    volumes:
      - /apps/sonarr_usenet:/config
      - /mnt/usenet:/mnt/usenet
      - /mnt/usenet:/data
      - /mnt/remote:/mnt/remote:rslave
    expose:
      - 8989
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:8989/ping"]
    restart: unless-stopped
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth sonarr_usenet sonarr_usenet:8989

networks:
  default:
    name: public_default
    external: true
