services:
  nzbdav:
    # nosemgrep
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    environment:
      TZ: ${TZ:-UTC}
      # dotnet/aspnet default uid, gid required with read_only: true
      PUID: 1654
      PGID: 1654
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/nzbdav:/config
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav {{ upstreams 3000 }}
      tinyauth.apps.nzbdav.path.allow: \/(api$|content)

  usenetstreamer:
    # nosemgrep
    image: ghcr.io/sanket9225/usenetstreamer:1.8.1@sha256:6849cacb9cdd63ad2197cc38bf58d83cb8a93dbfb34eb5770e75d858730a3327
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/usenetstreamer:/data/config
    tmpfs:
      - /usr/src/app/cache
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth usenetstreamer {{ upstreams 7000 }}
      tinyauth.apps.usenetstreamer.path.allow: \/(manifest|nzb|stream)

  streamnzb:
    # nosemgrep
    image: ghcr.io/gaisberg/streamnzb:v4.8.0@sha256:344a67b188452911777ac3309bba5a443e9b19db2c0b1f3991c9aaa0ae9b86dd
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/streamnzb:/app/data
    tmpfs:
      - /tmp
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth streamnzb {{ upstreams 7000 }}
      tinyauth.apps.streamnzb.path.allow: \/(manifest|play|stream)

  altmount:
    # nosemgrep
    image: ghcr.io/javi11/altmount:v0.2.0@sha256:2592723a519248340e43fa5a564cff01f3faf24f680ba4d8a1ae84f2e87c2cd2
    environment:
      # PUID/PGID has no effect with read_only: true
      PUID: 911
      PGID: 911
      TZ: ${TZ:-UTC}
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth altmount {{ upstreams 8080 }}
      tinyauth.apps.altmount.path.allow: \/(sabnzbd|stream|stremio|webdav)

networks:
  default:
    name: proxy
    external: true
