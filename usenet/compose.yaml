services:
  nzbhydra2:
    # nosemgrep
    image: lscr.io/linuxserver/nzbhydra2:8.8.4@sha256:15f3fdd5e8ca21218c5f9aae0a2a2aaa47e600519c9d7caa81a5ebf23235ed01
    environment: &envs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/nzbhydra2:/config
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 5076
    healthcheck:
      test: [CMD, curl, -fsSL, "http://localhost:5076/actuator/health/ping"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbhydra2 nzbhydra2:5076
      tinyauth.apps.nzbhydra2.path.allow: \/api

  nzbdav:
    # nosemgrep
    image: ghcr.io/nzbdav-dev/nzbdav:0.6.4@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    environment:
      <<: *envs
      # dotnet/aspnet default uid, gid required
      # otherwise conflicts with read_only
      PUID: 1654
      PGID: 1654
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/nzbdav:/config
    tmpfs:
      - /tmp
    expose:
      - 3000
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:3000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth nzbdav nzbdav:3000
      tinyauth.apps.nzbdav.path.allow: \/(api$|content)

  usenetstreamer:
    # nosemgrep
    image: ghcr.io/sanket9225/usenetstreamer:1.8.0@sha256:63d40e380ff9f420c1524c65a759ac9f7de18f648eae2488828704e4f8c2d8ab
    environment:
      ADDON_SHARED_SECRET: ${USENETSTREAMER_SHARED_SECRET:?}
      NZBDAV_URL: http://nzbdav:3000
      NZBDAV_WEBDAV_URL: http://nzbdav:3000
      CONFIG_DIR: /data/config
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/usenetstreamer:/data/config
    tmpfs:
      - /usr/src/app/cache
    expose:
      - 7000
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:7000/"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth usenetstreamer usenetstreamer:7000
      tinyauth.apps.usenetstreamer.path.allow: \/(manifest|nzb|stream)

  streamnzb:
    # nosemgrep
    image: ghcr.io/gaisberg/streamnzb:v4.8.0@sha256:344a67b188452911777ac3309bba5a443e9b19db2c0b1f3991c9aaa0ae9b86dd
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - /apps/streamnzb:/app/data
    tmpfs:
      - /tmp
    expose:
      - 7000
      - 119
    healthcheck:
      test: [CMD, wget, -qO-, "http://localhost:7000/health"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth streamnzb streamnzb:7000
      tinyauth.apps.streamnzb.path.allow: \/(manifest|play|stream)

  altmount:
    # nosemgrep
    image: ghcr.io/javi11/altmount:v0.2.0@sha256:2592723a519248340e43fa5a564cff01f3faf24f680ba4d8a1ae84f2e87c2cd2
    environment:
      <<: *envs
      JWT_SECRET: ${ALTMOUNT_JWT_SECRET:?}
      COOKIE_DOMAIN: altmount.${DOMAIN:?}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    volumes:
      - /apps/altmount:/config
      - /apps/altmount/metadata:/metadata
    tmpfs:
      - /run:exec
      - /tmp
    expose:
      - 8080
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
          pids: 512
    labels:
      caddy: "*.{$$DOMAIN}"
      caddy.import: reverse_proxy_auth altmount altmount:8080
      tinyauth.apps.altmount.path.allow: \/(sabnzbd|stream|stremio|webdav)

networks:
  default:
    name: caddy
    external: true
